# Dependabot — automated dependency freshness (Phase 8 Wave 3, 8W3.5).
#
# WHY this exists: 8W3.4 SHA-pinned every third-party Action, and 8W3.3
# showed what happens when a lockfile sits still for a month (29 CVE
# entries of pure staleness). Pinning without automated bumping trades
# supply-chain risk for staleness risk; this file closes the loop.
#
# WHY no `docker` ecosystem entry: portal/Dockerfile FROMs
# cgr.dev/chainguard/wolfi-base on its only free tag (`latest`), so
# there is no version for Dependabot to bump. Digest-pinning the base
# (which would give Dependabot a digest to roll) is banked for the
# Phase 10 full-distroless refactor.

version: 2
updates:
  # ── GitHub Actions (both workflow files) ──────────────────────────
  # Bumps the SHA pin + its `# vX.Y.Z` comment together — Dependabot
  # understands the pin-with-comment convention natively.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    # Keep Dependabot PRs on our conventional-commit style (Phase 0
    # convention, carried over from the original github-actions-only
    # version of this file).
    commit-message:
      prefix: "chore"
      include: scope

  # ── Backstage app (portal/) ───────────────────────────────────────
  - package-ecosystem: npm
    directory: /portal
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - portal
    commit-message:
      prefix: "chore"
      include: scope
    # @backstage/* framework packages move as ONE coherent release
    # line via `backstage-cli versions:bump`, never individually —
    # per-package bumps create exactly the duplicate-copy drift we
    # root-caused in 8W3.3 (backend-defaults@0.12.3 residue pinning
    # vulnerable urllib@3/undici@5). Community + third-party plugins
    # (@backstage-community/*, @terasky/*) version independently and
    # stay in scope.
    ignore:
      - dependency-name: "@backstage/*"
      # React-family MAJORS are dictated by the Backstage release line
      # (the whole frontend is built on React 18 + react-router 6), so
      # they move with `backstage-cli versions:bump`, not on their own.
      # The first npm run proposed react 19, react-router 8,
      # react-router-dom 7 and jest-dom 7; react/react-router failed
      # install + test. Minor/patch updates for these stay in scope.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/*"
        update-types: ["version-update:semver-major"]
    # ~1700 transitives would otherwise mean PR-per-package noise;
    # one grouped PR per week keeps review tractable. Majors stay
    # ungrouped (and rare) so breaking changes get individual review.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
