---
# reusable-service-ci.yml — the platform's reusable CI/CD workflow.
#
# EVERY service scaffolded from templates/nodejs-fastify-svc inherits
# this pipeline via a ~15-line wrapper at .github/workflows/ci.yml in
# the service repo. One workflow, N consumers. Changes to the pipeline
# (new scanner, new signer, new stage) propagate to every service
# automatically. Documented in ADR-0032.
#
# Trigger: workflow_call ONLY — this workflow doesn't run on its own
# pushes. Consumers invoke it:
#
#   # In <service-repo>/.github/workflows/ci.yml:
#   jobs:
#     ci:
#       uses: kelechi-nwankpa/internal-developer-platform/.github/workflows/reusable-service-ci.yml@main
#       permissions:
#         contents: write    # for manifest commit-back
#         packages: write    # for GHCR push
#         id-token: write    # for OIDC → GHCR + cosign
#       with:
#         service-name: platform-hello
#
# Fail-fast job chain:
#   install-and-test  → compile + unit tests
#   build             → per-arch NATIVE builds (amd64 on ubuntu-latest,
#                       arm64 on ubuntu-24.04-arm). No QEMU anywhere.
#                       On push events each leg pushes BY DIGEST (no
#                       tags yet); on PRs it only builds.
#   scan              → Trivy HIGH/CRITICAL blocks the pipeline
#   merge             → stitches the per-arch digests into one tagged
#                       multi-arch manifest (buildx imagetools create),
#                       ONLY on push to main or tag (not PRs)
#   sign              → cosign keyless signing via GitHub OIDC → Rekor
#   update-manifest   → kustomize edit set image + commit back to repo
#                       (ONLY on push to main, not tag or PR)
#
# WHY native runners instead of QEMU (Phase 8 Wave 3, 8W3.2):
#   QEMU user-mode emulation reliably mis-compiles heavy node-gyp
#   native modules (tree-sitter, cpu-features): the identical
#   Dockerfile compiled clean on native amd64 (CI) and native arm64
#   (local repro) but failed only on the QEMU-emulated arm64 CI leg.
#   GitHub's free arm64 runners for public repos remove the emulator
#   from the chain entirely — and cut arm64 build time massively.
#   Note: by-digest blobs land in GHCR before Trivy passes, but no
#   TAG exists until merge (post-scan), so nothing referenceable by
#   tag ever ships unscanned.
#
# Permissions principle: nothing has write by default. Each job declares
# ONLY what it needs. The consumer wrapper grants the superset; this
# file narrows per job.

name: Reusable Service CI/CD

on:
  workflow_call:
    inputs:
      service-name:
        description: "Service name — used for image name + manifest selector"
        required: true
        type: string
      image-registry:
        description: "Container registry hostname"
        required: false
        type: string
        default: ghcr.io
      image-repo:
        description: "Full image repo path (default: github.repository, e.g. kelechi-nwankpa/platform-hello)"
        required: false
        type: string
        default: ${{ github.repository }}
      manifest-path:
        description: >-
          Path to kustomize manifests inside the service repo. Set to
          empty string to SKIP the update-manifest job entirely (useful
          for services deployed via Helm chart values rather than
          kustomize — e.g. the Backstage portal).
        required: false
        type: string
        default: kubernetes
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      platforms:
        description: "Container build platforms (comma-separated)"
        required: false
        type: string
        default: linux/amd64,linux/arm64
      package-manager:
        description: >-
          Node package manager. `npm` (default) uses npm ci + npx tsc +
          npm test; `yarn` uses yarn install --immutable + yarn tsc +
          yarn test. Branches apply to the install-and-test job only;
          Docker image build is package-manager agnostic (Dockerfile
          decides).
        required: false
        type: string
        default: npm
      docker-context:
        description: >-
          Docker build context — path relative to repo root. Default `.`
          works when Dockerfile is at repo root (platform-hello pattern).
          For sub-directory apps (e.g. portal/), set to the subdir.
        required: false
        type: string
        default: "."
      dockerfile-path:
        description: >-
          Dockerfile path relative to repo root. Default `./Dockerfile`
          matches the context root. For sub-directory apps, set to e.g.
          `./portal/Dockerfile`.
        required: false
        type: string
        default: ./Dockerfile
    outputs:
      image-ref:
        description: "Fully-qualified image reference pushed to the registry"
        value: ${{ jobs.merge.outputs.image-ref }}

# Default top-level permissions = read-only. Each write-needing job
# declares its own.
permissions:
  contents: read

jobs:

  # ─────────────────────────────────────────────────────────────────
  # install-and-test — compile the TS, run tests. Fail fast.
  # ─────────────────────────────────────────────────────────────────
  install-and-test:
    name: Install + test
    runs-on: ubuntu-latest
    # Working directory = docker-context, so yarn install reads the
    # right package.json for sub-directory apps (portal/) too.
    defaults:
      run:
        working-directory: ${{ inputs.docker-context }}
    steps:
      - name: Checkout service repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node ${{ inputs.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: >-
            ${{ inputs.docker-context }}/${{ inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json' }}

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        run: npm ci --ignore-scripts

      - name: Install dependencies (yarn)
        if: inputs.package-manager == 'yarn'
        # Yarn 4 default: no scripts run on install. --immutable fails
        # if yarn.lock is out of date (CI-safe equivalent of npm ci).
        run: yarn install --immutable

      - name: TypeScript compile check (npm)
        if: inputs.package-manager == 'npm'
        run: npx tsc --noEmit

      - name: TypeScript compile check (yarn)
        if: inputs.package-manager == 'yarn'
        # Backstage's `yarn tsc` wraps tsc via backstage-cli; it understands
        # the workspace layout and compiles all packages at once.
        run: yarn tsc

      - name: Run tests (npm)
        if: inputs.package-manager == 'npm'
        # No exit-code fallback: node --test exits 1 both for "no tests
        # found" AND for failing tests, so any `|| test $? -eq 1` mask
        # also passes real failures. The golden-path template ships a
        # test suite, so a service with zero tests SHOULD fail here.
        run: npm test

      - name: Run tests (yarn)
        if: inputs.package-manager == 'yarn'
        # Backstage apps always have tests (scaffold ships them). No fallback.
        run: yarn test

  # ─────────────────────────────────────────────────────────────────
  # build — per-arch NATIVE container builds. amd64 on ubuntu-latest,
  # arm64 on GitHub's free arm64 runners. No QEMU (see header).
  # GHA layer cache is SCOPED per arch so the legs don't clobber
  # each other's cache entries.
  #
  # On push events each leg pushes by digest (untagged) and exports
  # the digest as an artifact; the merge job downstream stitches the
  # digests into the tagged multi-arch manifest AFTER Trivy passes.
  # On PR events this is build-only validation.
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build container
    runs-on: ${{ matrix.runner }}
    needs: install-and-test
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    permissions:
      contents: read
      packages: write    # by-digest push on push events
    steps:
      - name: Checkout service repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR (push events only)
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.image-registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only here — TAGS are computed in the merge job, because
      # by-digest pushes are deliberately untagged.
      - name: Compute OCI labels
        id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image-registry }}/${{ inputs.image-repo }}

      - name: Build (PR — validate only, no push)
        if: github.event_name != 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile-path }}
          platforms: ${{ matrix.platform }}
          push: false
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Build + push by digest (push events)
        if: github.event_name == 'push'
        id: docker-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile-path }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          outputs: type=image,name=${{ inputs.image-registry }}/${{ inputs.image-repo }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Export digest for merge job
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.docker-build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # scan — Trivy on the built image. Fail on HIGH + CRITICAL.
  # Runs on a locally-loaded amd64 image (SARIF-level scanning).
  # ─────────────────────────────────────────────────────────────────
  scan:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout service repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Re-build amd64-only + load into local Docker daemon so Trivy
      # can scan the image by name. Reuses the amd64-SCOPED GHA cache
      # from the build matrix leg above — effectively a cache replay,
      # not a real rebuild.
      - name: Build amd64 image into local Docker for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile-path }}
          platforms: linux/amd64
          load: true
          tags: ${{ inputs.service-name }}:scan
          cache-from: type=gha,scope=amd64

      # Pinned to tag for Phase 7. Phase 8 security hardening will
      # repin all third-party actions to commit SHAs to defeat tag-moving
      # supply-chain attacks (an attacker with write access to the action
      # repo can repoint v0.36.0 to a malicious commit; a SHA pin can't
      # be forged).
      - name: Trivy scan (HIGH + CRITICAL blocks)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.service-name }}:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # trivyignores path. Default `./.trivyignore` works when
          # docker-context is `.` (platform-hello pattern — .trivyignore
          # at service repo root). For sub-directory apps (portal/),
          # the .trivyignore lives alongside the Dockerfile in that
          # subdir, so we glue docker-context onto the filename.
          trivyignores: ${{ inputs.docker-context }}/.trivyignore

  # ─────────────────────────────────────────────────────────────────
  # merge — stitch the per-arch digests (pushed by the build matrix)
  # into ONE tagged multi-arch manifest. Only on push to main or tag.
  # NOT on PRs. Runs AFTER Trivy, so no tag ever points at an
  # unscanned image.
  # ─────────────────────────────────────────────────────────────────
  merge:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: github.event_name == 'push'
    permissions:
      packages: write    # manifest push via GITHUB_TOKEN
      id-token: write    # OIDC federation (cosign chain downstream)
    outputs:
      image-ref: ${{ steps.ref.outputs.image-ref }}
      image-digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download per-arch digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR (via OIDC-federated GITHUB_TOKEN)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.image-registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image-registry }}/${{ inputs.image-repo }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Create + push multi-arch manifest
        id: manifest
        env:
          REPO: ${{ inputs.image-registry }}/${{ inputs.image-repo }}
        run: |
          cd /tmp/digests
          # Each file is named after one arch digest (sha256 hex).
          tag_args=$(echo "${{ steps.docker-meta.outputs.tags }}" | xargs -I{} echo -n "-t {} ")
          echo "Creating manifest with tags: ${tag_args}"
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create ${tag_args} \
            $(printf "${REPO}@sha256:%s " *)
          # Resolve the MERGED manifest's own digest for cosign.
          sha_tag=$(echo "${{ steps.docker-meta.outputs.tags }}" | grep -m1 ":sha-")
          digest=$(docker buildx imagetools inspect "${sha_tag}" \
            --format '{{ json .Manifest.Digest }}' | tr -d '"')
          echo "Merged manifest digest: ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${sha_tag}"

      - name: Emit SHA-tag ref for downstream jobs
        id: ref
        run: |
          # Grab the first sha-* tag (the one update-manifest will pin to).
          sha_tag=$(echo "${{ steps.docker-meta.outputs.tags }}" | grep -m1 ":sha-")
          echo "image-ref=${sha_tag}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────
  # sign — cosign keyless signing via Fulcio + Rekor transparency log.
  # Signs every pushed tag. Phase 8 Kyverno will enforce verification.
  # ─────────────────────────────────────────────────────────────────
  sign:
    name: cosign keyless sign
    runs-on: ubuntu-latest
    needs: merge
    permissions:
      packages: write    # cosign writes signature manifest alongside image
      id-token: write    # OIDC federation → Fulcio identity attestation
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.4.1

      - name: Login to GHCR for signature push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.image-registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image by digest (immutable reference)
        env:
          # The MERGED multi-arch manifest digest (resolved by the
          # merge job's imagetools inspect) — signing this covers
          # both per-arch images via the manifest list.
          IMAGE: ${{ inputs.image-registry }}/${{ inputs.image-repo }}@${{ needs.merge.outputs.image-digest }}
        run: |
          echo "Signing ${IMAGE}"
          cosign sign --yes "${IMAGE}"

  # ─────────────────────────────────────────────────────────────────
  # update-manifest — bump deployment image tag + git commit-back.
  # ONLY on push to main (not tag — tags are human-driven releases).
  # ─────────────────────────────────────────────────────────────────
  update-manifest:
    name: Update deployment manifest
    runs-on: ubuntu-latest
    needs: sign
    # Skip entirely when manifest-path is empty — used for services
    # deployed via Helm chart values rather than kustomize (e.g. the
    # Backstage portal, whose image tag lives in the chart's
    # valuesObject). Those services update their chart manifests
    # manually or via a separate workflow.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && inputs.manifest-path != ''
    permissions:
      contents: write    # push the manifest-bump commit back
    # One manifest bump per repo at a time. Overlapping pushes used to run
    # this job in parallel; every run edits the same newTag line, so the
    # loser's rebase always conflicted (platform-hello a181cf2). While one
    # runs, GitHub keeps only the NEWEST pending run and cancels older
    # ones, so superseded deploys are dropped, never applied out of order.
    concurrency:
      group: update-manifest-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout service repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Latest main, not github.sha: the bump lands on top of any deploy
          # commits already pushed, so there is nothing to rebase.
          ref: main
          # Full history so the freshness check can walk github.sha..main.
          fetch-depth: 0
          # Use the default GITHUB_TOKEN (sufficient for same-repo write).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if a newer source commit is already on main
        id: freshness
        env:
          BUILT_SHA: ${{ github.sha }}
        run: |
          # Commits after ours that the bot did NOT author are newer source
          # changes; their own run deploys them. Deploying ours now would
          # roll the service back.
          newer=$(git log --format='%ae' "${BUILT_SHA}..HEAD" \
            | grep -vc 'github-actions\[bot\]' || true)
          if [ "${newer}" -gt 0 ]; then
            echo "main has ${newer} newer source commit(s); skipping stale deploy of ${BUILT_SHA:0:7}."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kustomize
        if: steps.freshness.outputs.stale != 'true'
        # Pinned release + hash-verified tarball. Replaces
        # `curl install_kustomize.sh@master | bash`, which (a) executed an
        # unpinned script from a moving branch in the one job holding
        # contents:write, and (b) called the GitHub API unauthenticated —
        # runners share egress IPs, so the 60/h anonymous limit failed a
        # platform-hello deploy ("Github rate-limiter failed the request").
        # Release downloads are not API calls. To upgrade: bump the version
        # and replace the hash with the linux_amd64 line from that
        # release's checksums.txt.
        env:
          KUSTOMIZE_VERSION: v5.8.3
          KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
        run: |
          tarball="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${tarball}" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/${tarball}"
          echo "${KUSTOMIZE_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" kustomize
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Bump image tag in manifest
        if: steps.freshness.outputs.stale != 'true'
        # SHA truncation MUST happen inside `run:`, not inside `env:`.
        # YAML `env:` values are stored as literal strings — shell
        # expansion ($(...), backticks) is never applied. The previous
        # version of this step set IMAGE_REF to the literal string
        # `...:sha-$(echo "<full sha>" | cut -c1-7)`, which kustomize
        # happily wrote into kustomization.yaml verbatim, breaking
        # ArgoCD pulls. Compute inside the shell where $(...) works.
        env:
          IMAGE_REGISTRY: ${{ inputs.image-registry }}
          IMAGE_REPO: ${{ inputs.image-repo }}
          FULL_SHA: ${{ github.sha }}
        run: |
          short_sha=$(echo "${FULL_SHA}" | cut -c1-7)
          image_ref="${IMAGE_REGISTRY}/${IMAGE_REPO}:sha-${short_sha}"
          echo "Setting image to: ${image_ref}"
          cd "${{ inputs.manifest-path }}"
          # kustomize edit set image NAME=REF substitutes any image
          # named `NAME` in the kustomization's resources to use REF.
          # NAME here matches the Deployment's image line (service-name)
          # — kustomize matches on image repo prefix.
          kustomize edit set image "${IMAGE_REGISTRY}/${IMAGE_REPO}=${image_ref}"
          cd ..
          git diff "${{ inputs.manifest-path }}"

      - name: Commit + push manifest bump
        if: steps.freshness.outputs.stale != 'true'
        env:
          SHA_SHORT: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Skip if nothing changed (idempotent re-run safety).
          if git diff --quiet; then
            echo "No manifest change — image tag already current."
            exit 0
          fi
          short_sha=$(echo "${SHA_SHORT}" | cut -c1-7)
          git add "${{ inputs.manifest-path }}/"
          # Multi-line commit message via heredoc — plain string in the
          # YAML `run:` block would confuse the YAML parser (lines look
          # like YAML keys).
          commit_msg=$(cat <<MSG
          chore: deploy sha-${short_sha}

          Automated manifest bump from reusable-service-ci.
          Triggered by: ${{ github.event_name }} on ${{ github.ref }}
          Image: ${{ inputs.image-registry }}/${{ inputs.image-repo }}:sha-${short_sha}
          MSG
          )
          git commit -m "${commit_msg}"
          # Retry on non-fast-forward (rare: concurrent main merges).
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected — rebasing and retrying (attempt ${attempt}/3)"
            # -X theirs: on a newTag conflict keep OUR bump (in a rebase,
            # 'theirs' is the commit being replayed). Only reachable when a
            # human pushes between checkout and push; the concurrency group
            # rules out another bot bump.
            git pull --rebase -X theirs origin main
          done
          echo "Push failed after 3 attempts"
          exit 1
