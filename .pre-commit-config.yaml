# Pre-commit configuration
# ─────────────────────────────────────────────────────────────
# Local usage:
#   pre-commit install           # install as a git hook (one-time)
#   pre-commit run --all-files   # run against every tracked file
#   pre-commit run <hook-id>     # run one hook
#
# CI usage:
#   The same file is executed in .github/workflows/ci.yml. Whatever fails
#   here fails there. One source of truth, two enforcement points.
#
# Versioning:
#   Repos are pinned to tags for readability. In a hardened production
#   pipeline we would SHA-pin (rev: <full-sha>) for supply-chain integrity.
#   Dependabot's github-actions ecosystem does not update pre-commit hooks —
#   run `pre-commit autoupdate` monthly, or add pre-commit.ci.

default_language_version:
  python: python3

# Skip auto-generated or vendored paths across every hook.
#
# portal/* exclusions added Phase 5 Wave 2: Backstage's scaffolded app
# ships a vendored yarn CLI (.yarn/releases/*.cjs), a large lockfile
# (yarn.lock ~1.2MB — larger than our 500KB linter threshold, but
# intentionally tracked for CI reproducibility same as any lockfile),
# and binary asset files (public/*.svg, *.png, *.ico — favicons, logos).
# All framework-managed; linting them produces false positives (gitleaks
# flagging Algolia search public keys, EOF-fixer corrupting binary SVGs).
exclude: |
  (?x)^(
    node_modules/.*|
    cdk\.out/.*|
    \.yarn/.*|
    portal/\.yarn/.*|
    portal/yarn\.lock|
    portal/packages/[^/]+/public/.*|
    dist/.*|
    build/.*
  )$

repos:
  # ─────────────────────────────────────────────────────────────
  # Structural hygiene — parse validity, formatting basics.
  # These are the cheapest, highest-signal checks; they run first.
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        # Skip template skeleton files — they contain {{PLACEHOLDER}}
        # syntax that isn't valid YAML until rendered by bin/render.sh.
        exclude: ^templates/.*/skeleton/
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ─────────────────────────────────────────────────────────────
  # Secret scanning — CLAUDE.md §9 non-negotiable.
  # Blocks the single fastest way to lose money on AWS.
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        # Global exclude doesn't apply to gitleaks' own matcher — need
        # per-hook exclude. Scaffolded Backstage vendored yarn CLI
        # (portal/.yarn/releases/*.cjs) contains Algolia search API
        # keys (public, used by backstage.io docs search); gitleaks
        # flags them as generic-api-key. False positive.
        exclude: ^portal/\.yarn/.*

  # ─────────────────────────────────────────────────────────────
  # editorconfig compliance — cross-verifies that .editorconfig
  # is actually followed. Belt-and-braces alongside the pre-commit-hooks
  # whitespace/EOL fixers above.
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.0.3
    hooks:
      - id: editorconfig-checker

  # ─────────────────────────────────────────────────────────────
  # YAML linting — .yamllint.yml holds the ruleset.
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yml"]
        # Skip template skeleton files — they contain {{PLACEHOLDER}}
        # syntax that isn't valid YAML until rendered by bin/render.sh.
        exclude: ^templates/.*/skeleton/

  # ─────────────────────────────────────────────────────────────
  # Markdown linting — .markdownlint.json holds the ruleset.
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]

  # ─────────────────────────────────────────────────────────────
  # Shell script linting — no shell files yet, but the hook is ready
  # for when Phase 0.6's Makefile shells out and later phases add scripts.
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
