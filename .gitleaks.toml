# Gitleaks configuration for the Internal Developer Platform.
# Rules are inherited from gitleaks' default ruleset via `useDefault = true`.
# We only add allowlists that scope out documented false-positive patterns.

title = "IDP gitleaks config"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# CDK snapshot test artifacts.
#
# `cdk synth` produces CloudFormation JSON with deterministic asset keys
# (`S3Key`, `TemplateURL`) that are high-entropy SHA-256 hashes of the
# generated bytes. These are not credentials — they're content-addressed
# storage paths. Gitleaks' `generic-api-key` rule flags them by entropy.
#
# Real secrets can only reach a snapshot if they exist in the source stack
# code first, where a scan of `infra/lib/**` and `infra/bin/**` catches them.
# Allowlisting the snapshot directory therefore does not weaken coverage.
#
# Uses the singular `[allowlist]` form because the pre-commit gitleaks
# pin is v8.21.2 — the plural `[[allowlists]]` (array-of-tables) form
# only became supported in v8.26+.
# ---------------------------------------------------------------------------
[allowlist]
description = "CDK snapshot test artifacts contain deterministic asset hashes, not secrets"
paths = [
  '''infra/test/__snapshots__/.*\.snap$''',
]
