---
# ClusterSecretStore/vault-kv — tells ESO how to reach Vault.
#
# ClusterSecretStore is the cluster-scoped variant of SecretStore: any
# namespace can reference it from an ExternalSecret. (SecretStore, the
# namespace-scoped equivalent, would be for multi-tenant clusters where
# each team owns a different backend. Not our case — one platform-managed
# Vault serves the whole cluster.)
#
# Auth flow (proven manually in Task 2.4.i):
#   1. ESO's controller pod (ServiceAccount external-secrets/external-secrets)
#      requests a fresh SA JWT from the kubelet.
#   2. Sends that JWT to Vault's kubernetes/login endpoint with role=eso-reader.
#   3. Vault calls TokenReview on kube-apiserver (using its own SA token,
#      granted via the ClusterRoleBinding in platform/vault/) to validate.
#   4. Vault issues a Vault token bound to the eso-reader policy (1h TTL).
#   5. ESO uses that Vault token to read from secret/data/*.
#
# On EKS (Phase 9), a second ClusterSecretStore/aws-secrets-manager
# will exist alongside this one, authenticating via IRSA instead of
# k8s auth. Same abstraction; different auth source. Same ExternalSecret
# manifests can reference either — the source of truth for a secret is
# a per-secret choice.
#
# See: docs/adr/0020-eso-backend-strategy.md

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-kv
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secretstore
spec:
  provider:
    vault:
      # In-cluster DNS — vault Service in the vault namespace, port 8200.
      # HTTP not HTTPS because Vault's standalone config has tls_disable = 1
      # (ADR-0019 — self-signed cert overhead not worth it on kind for
      # in-cluster traffic; Phase 5 could give Vault a cert-manager cert
      # if we wanted external UI TLS).
      server: "http://vault.vault.svc:8200"

      # KV v2 engine mounted at path `secret/` (enabled in Task 2.4.i).
      # NOTE: for KV v2, the `path` field is the MOUNT path — not the
      # `secret/data/*` API path. ESO handles the /data/ prefix internally
      # when version: v2. Confusing at first; well-documented on the
      # ESO Vault provider page.
      path: "secret"
      version: "v2"

      auth:
        # Kubernetes auth method (enabled in Task 2.4.h).
        kubernetes:
          # Path where the k8s auth method is mounted in Vault. Default is
          # `kubernetes` (matches `vault auth enable kubernetes` without
          # -path=... override).
          mountPath: "kubernetes"
          # Vault role that binds the presenting SA to a policy. Created
          # in Task 2.4.i via `vault write auth/kubernetes/role/eso-reader`.
          role: "eso-reader"
          # Which ServiceAccount's JWT does ESO use to authenticate?
          # Its own — the external-secrets pod's SA. ESO's controller runs
          # as external-secrets/external-secrets by default (chart 2.8.0).
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
