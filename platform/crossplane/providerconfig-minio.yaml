---
# providerconfig-minio.yaml
#
# Tells provider-aws-s3 how to reach MinIO. The Composition in
# composition-objectbucket.yaml references providerConfigRef.name: default
# — so this MUST be named `default`. On EKS, we replace THIS file with
# an IRSA-based ProviderConfig (also named `default`), and the Composition
# + XRCs stay identical. One name, two environments.
#
# WHY custom endpoint + s3_use_path_style:
#   MinIO is S3-API-compatible but not S3. Two config differences:
#   1. endpoint.url points at MinIO's in-cluster Service, not amazonaws.com
#   2. s3_use_path_style=true because MinIO uses path-style URLs
#      (http://minio/bucket/key) not virtual-host style (http://bucket.minio/key).
#      Virtual-host requires DNS wildcard support which MinIO doesn't do.
#
# WHY region: us-east-1 even though MinIO is region-less:
#   AWS SDK signing (sigv4) requires a region in the request signature.
#   MinIO ignores the region value but the SDK still refuses to send
#   unsigned requests. us-east-1 is the harmless default.
#
# WHY source: Secret and not Upbound/IRSA/PodIdentity:
#   On kind we have no AWS, no IAM, no Upbound account. Secret is the
#   only workable option here. The EKS replacement uses IRSA (ADR-0020).

apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: minio-crossplane-creds   # materialised by the ExternalSecret
      key: creds                     # AWS shared-credentials INI format
  endpoint:
    url:
      type: Static
      static: http://minio.minio.svc.cluster.local:9000
    hostnameImmutable: true          # MinIO doesn't support hostname mutation
    services:
      - s3                           # applies only to S3 API calls
  s3_use_path_style: true            # MinIO requires path-style URLs

  # ─── MinIO compatibility flags ────────────────────────────────────
  # The underlying Terraform AWS provider calls sts:GetCallerIdentity
  # at startup to:
  #   (1) validate the credentials work
  #   (2) fetch the AWS account ID for resource ARNs
  # MinIO does not implement STS — it only implements S3 API. Without
  # these skip flags, the provider errors out before ever trying to
  # create a bucket:
  #   "cannot get account id: cannot get the caller identity:
  #    GetCallerIdentity query failed"
  # Discovered during Phase 4 Wave 2 smoke test (bug #2).
  skip_credentials_validation: true  # no STS to validate against
  skip_requesting_account_id: true   # no account ID — MinIO is single-tenant
  skip_metadata_api_check: true      # no IMDS — we're not in EC2
  skip_region_validation: true       # region is a signing-only artifact
