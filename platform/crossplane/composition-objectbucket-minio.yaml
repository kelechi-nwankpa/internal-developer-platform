---
# composition-objectbucket-minio.yaml
#
# MINIO/KIND VARIANT of the ObjectBucket Composition. Phase 4 Wave 2
# shipped this with a single Bucket MR. Phase 4 Wave 3 adds Policy + User
# MRs for per-service IAM, and emits a CompositeConnectionDetails object
# so the Claim's connection Secret is populated with everything the app
# Deployment needs via envFrom.
#
# Three MRs rendered per XRC (previously 1):
#   - Bucket   (vshn)  — the actual bucket in MinIO
#   - Policy   (vshn)  — grants all S3 ops on EXACTLY this bucket, nothing
#                        else. allowBucket shorthand (equivalent to a
#                        rawPolicy with s3:* on this bucket's ARN).
#   - User     (vshn)  — MinIO user with the Policy attached. Emits
#                        AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY in
#                        its connection details (names match AWS SDK
#                        env-var convention — no translation needed).
#
# Connection details propagation (Pipeline mode pattern — see
# function-go-templating README for provenance):
#
#   User MR writes its own connection Secret (via Crossplane default
#   behaviour on managed resources that implement ConnectionDetails) →
#   fn-go-templating reads from .observed.resources.<name>.connectionDetails
#   → function emits a CompositeConnectionDetails (meta.gotemplating.fn.
#   crossplane.io/v1alpha1) with templated values → Crossplane reads that
#   and populates the XR's connection Secret → because this XRC's Claim
#   has writeConnectionSecretToRef, Crossplane copies it to the Claim's
#   namespace with the specified name.
#
# OBSERVED-RESOURCES GUARD. On the FIRST render after XRC create, no
# composed MRs exist yet, so .observed.resources is nil. Trying to pull
# connection details then errors the template. We guard with
# {{ if .observed.resources.user }} ... {{ end }} so first render skips
# the CompositeConnectionDetails emission; subsequent reconciles populate
# it. The XR + Claim stay NotReady until the User's connection details
# materialise — which is correct: the Deployment should NOT roll until
# the Secret is populated.
#
# GAP-A unchanged from Wave 2: XRD params publicRead and versioning are
# still silently ignored on this variant (vshn provider doesn't expose
# them on Bucket). Documented in phase-4 close-out.
#
# See: docs/adr/0027-first-xrd-objectbucket.md

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xobjectbuckets-minio.platform.idp.io
  labels:
    provider: minio
    backend: minio-vshn
    component: object-bucket
spec:
  compositeTypeRef:
    apiVersion: platform.idp.io/v1alpha1
    kind: XObjectBucket

  mode: Pipeline

  pipeline:
    # ─────────────────────────────────────────────────────────────
    # Step 1 — render Bucket + Policy + User + emit CompositeConnectionDetails
    # ─────────────────────────────────────────────────────────────
    - step: render-mrs
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $spec := $xr.spec.parameters -}}
            {{- $name := $xr.metadata.name -}}
            {{- /*
                Stable 6-char suffix from the XR's UID (matches S3 variant).
                Used as the shared base name for all three MRs' external
                names, with "-user" and "-policy" suffixes to keep them
                distinguishable in MinIO's user and policy namespaces.
            */ -}}
            {{- $uid := $xr.metadata.uid | default "" -}}
            {{- $suffix := (substr 0 6 ($uid | replace "-" "")) | default (randAlphaNum 6 | lower) -}}
            {{- $bucketName := printf "%s-%s" $name $suffix -}}
            {{- $policyName := printf "%s-policy" $bucketName -}}
            {{- $userName := printf "%s-user" $bucketName -}}

            # ─────────────────────────────────────────────
            # MinIO Bucket
            # ─────────────────────────────────────────────
            apiVersion: minio.crossplane.io/v1
            kind: Bucket
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket
                crossplane.io/external-name: {{ $bucketName }}
            spec:
              forProvider:
                region: {{ $spec.region }}
              providerConfigRef:
                name: provider-config

            ---
            # ─────────────────────────────────────────────
            # MinIO Policy — allowBucket shorthand grants all S3 ops
            # on this bucket (and nothing on other buckets or admin APIs).
            # Equivalent to a rawPolicy with:
            #   s3:* on arn:aws:s3:::{bucket}, arn:aws:s3:::{bucket}/*
            # ─────────────────────────────────────────────
            apiVersion: minio.crossplane.io/v1
            kind: Policy
            metadata:
              name: {{ $name }}-policy
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: policy
                crossplane.io/external-name: {{ $policyName }}
            spec:
              forProvider:
                allowBucket: {{ $bucketName }}
              providerConfigRef:
                name: provider-config

            ---
            # ─────────────────────────────────────────────
            # MinIO User — holds the per-service access key pair.
            # Attached to the Policy above by name. User's connection
            # details auto-publish AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
            # (constants defined in operator/user/observe.go upstream).
            # ─────────────────────────────────────────────
            apiVersion: minio.crossplane.io/v1
            kind: User
            metadata:
              name: {{ $name }}-user
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: user
                crossplane.io/external-name: {{ $userName }}
            spec:
              forProvider:
                userName: {{ $userName }}
                policies:
                  - {{ $policyName }}
              providerConfigRef:
                name: provider-config

            {{- /*
                CompositeConnectionDetails emission — ONLY once the User
                MR has materialised its connectionDetails. On first render
                .observed.resources.user is nil → skip. On subsequent
                reconciles after User is Ready, pull the two credential
                keys (already base64-encoded by Crossplane since they
                come from a Secret) and template the three static/XR-
                derived keys (require | b64enc).
            */ -}}
            {{- $user := index .observed.resources "user" -}}
            {{- if and $user $user.connectionDetails -}}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: CompositeConnectionDetails
            data:
              AWS_ACCESS_KEY_ID: {{ index $user.connectionDetails "AWS_ACCESS_KEY_ID" }}
              AWS_SECRET_ACCESS_KEY: {{ index $user.connectionDetails "AWS_SECRET_ACCESS_KEY" }}
              BUCKET_NAME: {{ $bucketName | b64enc }}
              AWS_ENDPOINT_URL: {{ "http://minio.minio.svc.cluster.local:9000" | b64enc }}
              AWS_REGION: {{ $spec.region | b64enc }}
            {{- end }}

    # ─────────────────────────────────────────────────────────────
    # Step 2 — roll up all MRs' Ready status to the XR
    # ─────────────────────────────────────────────────────────────
    # XR becomes Ready when Bucket, Policy, AND User are all Ready.
    # Previously only Bucket needed to be Ready; now all three gate the
    # XR, which also gates the Claim, which is correct: don't tell the
    # app the bucket is "ready" until the credentials are actually
    # in the Secret.
    - step: auto-ready
      functionRef:
        name: function-auto-ready
