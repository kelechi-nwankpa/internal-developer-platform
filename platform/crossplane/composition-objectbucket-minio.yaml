---
# composition-objectbucket-minio.yaml
#
# MINIO/KIND VARIANT of the ObjectBucket Composition. Selected as the
# XRD's default Composition on kind so ObjectBucket XRCs land here.
#
# Renders three MRs + the claim's connection Secret (8W4.2 convergence —
# the "Phase 4 Wave 3" that platform-hello's objectbucket.yaml deferred):
#   - Bucket  — the bucket itself
#   - Policy  — allowBucket: all operations on THIS bucket only
#   - User    — a per-claim MinIO user holding only that Policy
#   - CompositeConnectionDetails — BUCKET_NAME, AWS_ACCESS_KEY_ID,
#     AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL, AWS_REGION, which Crossplane
#     copies into the claim's writeConnectionSecretToRef Secret
# Each service gets least-privilege credentials for its own bucket —
# never MinIO's root account, and no hand-made Secret.
#
# WHY no PublicAccessBlock/Versioning MRs (vs the S3 variant):
#   vshn/provider-minio's Bucket resource is deliberately simple — it
#   doesn't expose PublicAccessBlock, Versioning or ServerSideEncryption
#   as separate MRs the way the upbound AWS provider does. Our XRD
#   accepts publicRead + versioning params but on kind they're SILENTLY
#   IGNORED (Gap-A decision in Phase 4 Wave 2 strategic intro — see
#   phase-4 close-out log). On EKS the s3 variant respects them fully.
#   This is a dev-vs-prod feature gap, acceptable at XRD v1alpha1.
#
# WHY the kind-variant is default (and not the s3 variant):
#   This platform is kind-first per ADR-0005. The s3 variant becomes
#   default (via a one-line XRD change) when activating EKS in Phase 9.
#
# See: docs/adr/0027-first-xrd-objectbucket.md

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: xobjectbuckets-minio.platform.idp.io
  labels:
    provider: minio
    backend: minio-vshn
    component: object-bucket
spec:
  # Bind to the same XR type as the s3 variant — multiple Compositions
  # per XR type is the standard Crossplane pattern for env variance.
  compositeTypeRef:
    apiVersion: platform.idp.io/v1alpha1
    kind: XObjectBucket

  # Staging namespace for the XR's own connection Secret; Crossplane then
  # copies it into the claim's namespace. Unset, the XR has no
  # writeConnectionSecretToRef and nothing ever reaches the service.
  writeConnectionSecretsToNamespace: crossplane-system

  mode: Pipeline

  pipeline:
    # ─────────────────────────────────────────────────────────────
    # Step 1 — render ONE MR (vshn Bucket) via Go template
    # ─────────────────────────────────────────────────────────────
    - step: render-mrs
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $spec := $xr.spec.parameters -}}
            {{- $name := $xr.metadata.name -}}
            {{- /*
                Stable 6-char suffix from the XR's UID for bucket name
                uniqueness, matching the s3-variant pattern. On MinIO
                bucket names are per-cluster, not globally unique like
                real S3, but keeping the pattern identical makes bucket
                NAMING parity between environments (useful for log
                grepping, metrics labels, etc.).
            */ -}}
            {{- $uid := $xr.metadata.uid | default "" -}}
            {{- $suffix := (substr 0 6 ($uid | replace "-" "")) | default (randAlphaNum 6 | lower) -}}
            {{- $bucketName := printf "%s-%s" $name $suffix -}}

            # ─────────────────────────────────────────────
            # MinIO Bucket — the only MR we render on kind
            # ─────────────────────────────────────────────
            apiVersion: minio.crossplane.io/v1
            kind: Bucket
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket
            spec:
              forProvider:
                # vshn/provider-minio names the bucket from bucketName
                # (default: metadata.name) and IGNORES crossplane.io/external-name,
                # which this used to set — so the real bucket was
                # "<xr-name>" while the Policy and connection Secret pointed
                # at "<xr-name>-<suffix>" (NoSuchBucket; policy granted
                # nothing). Immutable after creation (provider webhook).
                bucketName: {{ $bucketName }}
                region: {{ $spec.region }}
              providerConfigRef:
                name: provider-config   # matches providerconfig-minio-vshn.yaml
            ---
            apiVersion: minio.crossplane.io/v1
            kind: Policy
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: policy
            spec:
              forProvider:
                # All operations on this one bucket, nothing else.
                allowBucket: {{ $bucketName }}
              providerConfigRef:
                name: provider-config
            ---
            apiVersion: minio.crossplane.io/v1
            kind: User
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: user
            spec:
              forProvider:
                policies:
                  - {{ $name }}
              # The provider writes AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
              # here and re-reads it on every reconcile.
              writeConnectionSecretToRef:
                name: {{ $name }}-minio-user
                namespace: crossplane-system
              providerConfigRef:
                name: provider-config
            {{- $user := index (.observed.resources | default dict) "user" }}
            {{- if and $user $user.connectionDetails }}
            ---
            # Connection details for the claim's Secret. The user's keys are
            # already base64 in observed state; literals are encoded here.
            # Rendered only once the User has published credentials.
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: CompositeConnectionDetails
            data:
              AWS_ACCESS_KEY_ID: {{ $user.connectionDetails.AWS_ACCESS_KEY_ID }}
              AWS_SECRET_ACCESS_KEY: {{ $user.connectionDetails.AWS_SECRET_ACCESS_KEY }}
              BUCKET_NAME: {{ $bucketName | b64enc }}
              AWS_ENDPOINT_URL: {{ "http://minio.minio.svc.cluster.local:9000" | b64enc }}
              AWS_REGION: {{ $spec.region | b64enc }}
            {{- end }}

            {{- /*
                XRD params publicRead and versioning are SILENTLY IGNORED
                on this variant. See Gap-A decision in phase-4 close-out.
                If those fields matter for dev-env fidelity in the future,
                add vshn provider's Policy MR for publicRead; versioning
                has no vshn equivalent and would need a different provider.
            */ -}}

    # ─────────────────────────────────────────────────────────────
    # Step 2 — roll up Bucket Ready status to the XR
    # ─────────────────────────────────────────────────────────────
    - step: auto-ready
      functionRef:
        name: function-auto-ready
