---
# XRD (Composite Resource Definition) — the developer-facing API for an
# S3 bucket abstraction.
#
# App engineers write ObjectBucket (namespace-scoped Claim/XRC); Crossplane
# creates the paired XObjectBucket (cluster-scoped XR) automatically. The
# Composition (composition-objectbucket.yaml) renders MRs (S3 Bucket,
# BucketPublicAccessBlock, BucketVersioning, BucketServerSideEncryption)
# from the XR field values.
#
# API discipline for v1alpha1: 3 fields only. Deliberately narrow — every
# field is a public API commitment. Add fields when a real use case demands
# them. Removing fields is much harder.
#
# See: docs/adr/0027-first-xrd-objectbucket.md
#      docs/phases/phase-4-crossplane.md (Task 4.4)

apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: xobjectbuckets.platform.idp.io
spec:
  # Our platform's API group — matches CLAUDE.md's mission for "platform-
  # authored APIs a developer consumes."
  group: platform.idp.io

  names:
    # Cluster-scoped composite resource. Rarely written directly; usually
    # created automatically when a Claim is created.
    kind: XObjectBucket
    plural: xobjectbuckets

  claimNames:
    # Namespace-scoped claim. THIS is what developers write. Binds 1:1
    # to an XObjectBucket at claim creation.
    kind: ObjectBucket
    plural: objectbuckets

  # Default Composition. We ship two Composition variants (Phase 4 Wave 2):
  #   - xobjectbuckets-minio.platform.idp.io — renders vshn/provider-minio
  #     Bucket MRs, works on kind.
  #   - xobjectbuckets-s3.platform.idp.io — renders upbound provider-aws-s3
  #     MRs (Bucket + PublicAccessBlock + Versioning + SSE), works on EKS.
  # Kind is the development default per ADR-0005, so we default here to
  # the -minio variant. Flip this one line to -s3 when activating EKS in
  # Phase 9 (or override per-XRC via spec.compositionRef for a mixed
  # deployment).
  defaultCompositionRef:
    name: xobjectbuckets-minio.platform.idp.io
  # The connection-Secret contract every Composition must fulfil (8W4.2).
  # Only these keys are copied into the claim's Secret, so a service sees
  # exactly what it needs — names match the AWS SDK's env-var chain.
  connectionSecretKeys:
    - BUCKET_NAME
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_ENDPOINT_URL
    - AWS_REGION
    # S3 variant only (Phase 9, ADR-0034): the IAM role the pod assumes
    # with its own short-lived token. The S3 variant sets this and leaves
    # the two key fields and the endpoint out; the MinIO variant does the
    # opposite. A service reads whichever its cluster provides.
    - AWS_ROLE_ARN

  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Convention: user-facing fields nested under `parameters`.
                # Crossplane injects other spec fields (compositionRef,
                # publishConnectionDetailsTo, etc.) alongside this.
                parameters:
                  type: object
                  properties:
                    region:
                      type: string
                      enum:
                        - eu-west-1
                        - us-east-1
                      description: >
                        AWS region for the bucket. Must be one of the
                        pre-approved list (matches ADR-0004 single-region
                        posture, with room to grow).
                    publicRead:
                      type: boolean
                      default: false
                      description: >
                        Whether the bucket allows anonymous public read.
                        Default false. When true, no BucketPublicAccessBlock
                        MR is rendered — bucket is exposed to the internet.
                        Use with extreme care.
                    versioning:
                      type: boolean
                      default: false
                      description: >
                        Whether object versioning is enabled. Default false.
                        When true, deleted/overwritten objects retain
                        previous versions (with associated storage cost).
                    serviceAccountName:
                      type: string
                      maxLength: 63
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      description: >
                        ServiceAccount (in the claim's namespace) allowed
                        to use the bucket on AWS. Defaults to the claim's
                        own name, which is what the golden-path template
                        creates. Ignored by the MinIO variant, which hands
                        out a key instead.
                  required:
                    - region
              required:
                - parameters

            # Status fields — populated by the Composition/Function based
            # on MR state. Starting minimal in v1alpha1; will grow as
            # real consumers ask for more.
            status:
              type: object
              properties:
                bucketName:
                  type: string
                  description: >
                    The generated S3 bucket name (claim-name + random suffix).
                    Populated once the Bucket MR reports Ready.
                roleArn:
                  type: string
                  description: >
                    S3 variant only. ARN of the IAM role the service
                    assumes. Set once the role exists and its policy is
                    attached, i.e. when the connection Secret is complete.
                bucketArn:
                  type: string
                  description: >
                    ARN of the created bucket. Populated once the Bucket MR
                    reports Ready.
