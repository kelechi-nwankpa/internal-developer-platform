---
# externalsecret-minio-creds.yaml
#
# Materialises a Kubernetes Secret `minio-crossplane-creds` in the
# crossplane-system namespace from Vault's secret/minio/root path.
# The provider-aws-s3 pod reads this Secret via the ProviderConfig
# (providerconfig-minio.yaml) to authenticate to MinIO.
#
# WHY this pattern (and not kubectl create secret):
#   - ESO + Vault is the house convention (ADR-0018, ADR-0020). Every
#     other secret in the platform flows this way; no new paradigm.
#   - On EKS this ExternalSecret is REPLACED by an IRSA-annotated
#     ServiceAccount (ADR-0020 EKS strategy). The ProviderConfig itself
#     also changes to `source: IRSA`. Keeping the ESO file namespaced
#     under platform/crossplane/ makes the EKS swap-out one commit.
#
# WHY a single `creds` key in AWS CLI shared-credentials INI format
# (and not two separate access_key / secret_key keys):
#   - The upbound provider-aws family's ProviderConfig schema expects
#     ONE secret key containing the full AWS shared-credentials INI
#     block. See provider-aws docs on credentials.source=Secret.
#   - Future-proofs for session_token support (STS) without re-shaping
#     the Secret.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-crossplane-creds
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore   # cluster-scoped — referenceable from any NS
  target:
    name: minio-crossplane-creds
    creationPolicy: Owner      # ESO owns the Secret; delete ES → delete Secret
    template:
      # Template the AWS shared-credentials INI format into one `creds` key
      # that provider-aws-s3's ProviderConfig can consume directly.
      type: Opaque
      data:
        creds: |
          [default]
          aws_access_key_id = {{ .rootUser }}
          aws_secret_access_key = {{ .rootPassword }}
  data:
    - secretKey: rootUser       # local name within the template context
      remoteRef:
        key: minio/root
        property: rootUser
    - secretKey: rootPassword
      remoteRef:
        key: minio/root
        property: rootPassword
