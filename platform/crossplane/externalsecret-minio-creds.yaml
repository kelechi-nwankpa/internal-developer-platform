---
# externalsecret-minio-creds.yaml
#
# Materialises a Kubernetes Secret `minio-crossplane-creds` in the
# crossplane-system namespace from Vault's secret/minio/root path.
# The vshn/provider-minio pod reads this Secret via the ProviderConfig
# (providerconfig-minio-vshn.yaml) to authenticate to MinIO.
#
# WHY this pattern (and not kubectl create secret):
#   - ESO + Vault is the house convention (ADR-0018, ADR-0020). Every
#     other secret in the platform flows this way; no new paradigm.
#   - On EKS, GitOps for storage uses the DIFFERENT provider (upbound
#     provider-aws-s3) with IRSA. This ESO file is kind-only; the EKS
#     equivalent is an IRSA-annotated ServiceAccount in the aws-side
#     ProviderConfig (not yet shipped, Phase 9).
#
# WHY two Secret keys (AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY) rather
# than one INI blob:
#   - vshn/provider-minio expects a Secret with exactly these two keys
#     (per samples/_secret.yaml in that repo). This is DIFFERENT from
#     upbound provider-aws family which wants a single `creds` key in
#     AWS CLI shared-credentials INI format.
#   - The key names are the standard AWS SDK env-var names; vshn's
#     provider reads them with that convention in mind.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-crossplane-creds
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore   # cluster-scoped — referenceable from any NS
  target:
    name: minio-crossplane-creds
    creationPolicy: Owner      # ESO owns the Secret; delete ES → delete Secret
    template:
      # vshn/provider-minio expects two Secret keys named exactly
      # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (the standard AWS
      # SDK env-var convention). ESO's template block maps our Vault
      # fields to those keys.
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ .rootUser }}"
        AWS_SECRET_ACCESS_KEY: "{{ .rootPassword }}"
  data:
    - secretKey: rootUser       # local name within the template context
      remoteRef:
        key: minio/root
        property: rootUser
    - secretKey: rootPassword
      remoteRef:
        key: minio/root
        property: rootPassword
