---
# Alertmanager's whole configuration, rendered by External Secrets
# (Phase 9, alert routing).
#
# WHY the config is built here and not in the Helm values: it contains
# three values that must not be in Git — the SMTP password, and the
# sender/recipient email address (a personal address in a public repo gets
# scraped). Alertmanager can read the password from a file but has no
# file option for the addresses. So the STRUCTURE (routes, receivers) lives
# in Git below, and External Secrets fills in the three values from Vault
# (secret/monitoring/alertmanager-smtp: username, password, to).
#
# Alternative rejected: the AlertmanagerConfig CRD. It takes the password
# from a Secret but still wants the addresses as plain text, and it scopes
# routes to one namespace unless the operator is reconfigured.
#
# ROUTING, deny-by-default: everything goes to "null" (visible in the
# Alertmanager UI only) unless it is severity=critical, which is emailed.
# Warnings are deliberately not emailed: an inbox full of warnings teaches
# people to ignore the one email that matters.
#
# The kube-prometheus-stack chart is pointed at the resulting Secret with
# alertmanagerSpec.useExistingSecret + configSecret.
#
# Rotation: `vault kv put` a new app password; this ExternalSecret
# refreshes hourly and the operator reloads Alertmanager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-email-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-email-config
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: platform-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: alertmanager-email-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # toJson quotes each value safely for YAML, whatever it contains.
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
            smtp_smarthost: smtp.gmail.com:587
            smtp_require_tls: true
            smtp_from: {{ .username | toJson }}
            smtp_auth_username: {{ .username | toJson }}
            # Google displays app passwords in groups of four with spaces;
            # strip them so a pasted value works either way.
            smtp_auth_password: {{ .password | replace " " "" | toJson }}
          route:
            receiver: "null"
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              # Watchdog always fires by design (proves the pipeline is
              # alive). Never email it.
              - matchers: ['alertname = "Watchdog"']
                receiver: "null"
              - matchers: ['severity = "critical"']
                receiver: email
          receivers:
            - name: "null"
            - name: email
              email_configs:
                - to: {{ .to | toJson }}
                  send_resolved: true
          inhibit_rules:
            # A critical alert mutes the warning/info for the same thing.
            - source_matchers: ['severity = "critical"']
              target_matchers: ['severity =~ "warning|info"']
              equal: [namespace, alertname]
            - source_matchers: ['severity = "warning"']
              target_matchers: ['severity = "info"']
              equal: [namespace, alertname]
  # The three *Strategy/*Policy fields and mergePolicy are the API's own
  # defaults, written out so ArgoCD does not see them as drift.
  data:
    - secretKey: username
      remoteRef:
        key: monitoring/alertmanager-smtp
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: monitoring/alertmanager-smtp
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: to
      remoteRef:
        key: monitoring/alertmanager-smtp
        property: to
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
