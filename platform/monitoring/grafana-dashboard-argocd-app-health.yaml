---
# Grafana dashboard: ArgoCD Application health (8W4.5). Loaded by the
# Grafana sidecar (label grafana_dashboard=1, all namespaces). Pairs with
# argocd-app-health-rules.yaml: the stats go red at 1, the table names
# exactly which Applications are not Synced/Healthy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-argocd-app-health
  namespace: argocd
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: argocd-app-health
    app.kubernetes.io/part-of: platform-monitoring
data:
  argocd-app-health.json: |
    {
      "uid": "argocd-app-health",
      "title": "ArgoCD \u2014 Application health",
      "tags": [
        "argocd",
        "platform",
        "8W4.5"
      ],
      "schemaVersion": 39,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Applications not Healthy",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(argocd_app_info{health_status!=\"Healthy\"}) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Applications not Synced",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(argocd_app_info{sync_status!=\"Synced\"}) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "App-health alerts firing",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(ALERTS{alertstate=\"firing\",alertname=~\"ArgoApp.*\"}) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Applications total",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(argocd_app_info)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "options": {
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 5,
          "type": "table",
          "title": "Applications that are not Synced/Healthy (empty = all good)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "argocd_app_info{health_status!=\"Healthy\"} or argocd_app_info{sync_status!=\"Synced\"}",
              "format": "table",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "instance": true,
                  "job": true,
                  "endpoint": true,
                  "pod": true,
                  "service": true,
                  "container": true
                },
                "indexByName": {
                  "name": 0,
                  "sync_status": 1,
                  "health_status": 2
                }
              }
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Non-healthy / non-synced Applications over time",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(argocd_app_info{health_status!=\"Healthy\"}) or vector(0)",
              "legendFormat": "not Healthy",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "count(argocd_app_info{sync_status!=\"Synced\"}) or vector(0)",
              "legendFormat": "not Synced",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        }
      ]
    }
