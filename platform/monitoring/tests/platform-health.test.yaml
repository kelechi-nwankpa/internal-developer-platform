# promtool unit tests for platform-health-rules.yaml (Phase 9).
# Each alert is tested in BOTH directions (fires when it should, stays
# quiet when it shouldn't), so the tests can actually fail.
#
# Run from the repo root: make rules-test
rule_files:
  - platform-health.rules.json
evaluation_interval: 1m
tests:
  # ── Disk ──────────────────────────────────────────────────────────
  # 1. 85% full: warning after 15m, never critical. The device is mounted
  #    at two paths and must produce ONE alert.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="n1",device="/dev/vda1",fstype="ext4",mountpoint="/var"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{instance="n1",device="/dev/vda1",fstype="ext4",mountpoint="/var"}'
        values: '15x40'
      - series: 'node_filesystem_size_bytes{instance="n1",device="/dev/vda1",fstype="ext4",mountpoint="/etc/hosts"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{instance="n1",device="/dev/vda1",fstype="ext4",mountpoint="/etc/hosts"}'
        values: '15x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: NodeDiskUsageHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: NodeDiskUsageHigh
        exp_alerts:
          - exp_labels: {severity: warning, instance: n1, device: /dev/vda1}
            exp_annotations:
              summary: "Node disk /dev/vda1 is 85% full"
              description: "/dev/vda1 on n1 has been above 80% for 15m. On kind nothing reclaims space automatically. Prune unused images: `docker exec idp-control-plane crictl rmi --prune`."
      - eval_time: 30m
        alertname: NodeDiskUsageCritical
        exp_alerts: []

  # 2. 95% full: critical after 5m, not before.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="n1",device="/dev/vda1",fstype="ext4",mountpoint="/var"}'
        values: '100x20'
      - series: 'node_filesystem_avail_bytes{instance="n1",device="/dev/vda1",fstype="ext4",mountpoint="/var"}'
        values: '5x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: NodeDiskUsageCritical
        exp_alerts: []
      - eval_time: 6m
        alertname: NodeDiskUsageCritical
        exp_alerts:
          - exp_labels: {severity: critical, instance: n1, device: /dev/vda1}
            exp_annotations:
              summary: "Node disk /dev/vda1 is 95% full — act now"
              description: "/dev/vda1 on n1 is above 90%. At 100% ArgoCD, Prometheus and Tempo fail and their write-ahead logs corrupt (2026-11-21 incident). Prune now: `docker exec idp-control-plane crictl rmi --prune`."

  # 3. Healthy disk (55% full) and a full tmpfs: nothing fires.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="n1",device="/dev/vda1",fstype="ext4",mountpoint="/var"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{instance="n1",device="/dev/vda1",fstype="ext4",mountpoint="/var"}'
        values: '45x40'
      - series: 'node_filesystem_size_bytes{instance="n1",device="tmpfs",fstype="tmpfs",mountpoint="/run"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{instance="n1",device="tmpfs",fstype="tmpfs",mountpoint="/run"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: NodeDiskUsageHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: NodeDiskUsageCritical
        exp_alerts: []

  # ── Certificates ──────────────────────────────────────────────────
  # 4. Expires 10 days after t=0: fires after 1h. (time() starts at 0.)
  - interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="edge-wildcard",exported_namespace="gateway"}'
        values: '864000x120'
      - series: 'certmanager_certificate_ready_status{name="edge-wildcard",exported_namespace="gateway",condition="True"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 59m
        alertname: CertificateExpiringSoon
        exp_alerts: []
      - eval_time: 61m
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels: {severity: critical, name: edge-wildcard, exported_namespace: gateway}
            exp_annotations:
              summary: "Certificate gateway/edge-wildcard expires in 9d 22h 59m 0s"
              description: "Renewal should have happened 30 days before expiry and has not. Check `kubectl -n gateway describe certificate edge-wildcard` and the cert-manager logs."
      - eval_time: 61m
        alertname: CertificateNotReady
        exp_alerts: []
      - eval_time: 61m
        alertname: CertManagerMetricsAbsent
        exp_alerts: []

  # 5. Expires in 60 days and Ready: nothing fires.
  - interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="edge-wildcard",exported_namespace="gateway"}'
        values: '5184000x120'
      - series: 'certmanager_certificate_ready_status{name="edge-wildcard",exported_namespace="gateway",condition="True"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: CertificateExpiringSoon
        exp_alerts: []
      - eval_time: 90m
        alertname: CertificateNotReady
        exp_alerts: []

  # 6. Not Ready: fires after 30m, not before. The condition="False"
  #    series being 1 must not create a second alert.
  - interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{name="edge-wildcard",exported_namespace="gateway",condition="True"}'
        values: '0x60'
      - series: 'certmanager_certificate_ready_status{name="edge-wildcard",exported_namespace="gateway",condition="False"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 29m
        alertname: CertificateNotReady
        exp_alerts: []
      - eval_time: 31m
        alertname: CertificateNotReady
        exp_alerts:
          - exp_labels: {severity: critical, name: edge-wildcard, exported_namespace: gateway, condition: "True"}
            exp_annotations:
              summary: "Certificate gateway/edge-wildcard is not Ready"
              description: "cert-manager has not been able to issue or renew this certificate for 30m. If it is the edge wildcard, HTTPS for every service is affected once the current one expires."

  # 7. No cert-manager metrics at all: the blind-spot alert fires after 30m.
  - interval: 1m
    input_series:
      - series: 'up{job="something-else"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 29m
        alertname: CertManagerMetricsAbsent
        exp_alerts: []
      - eval_time: 31m
        alertname: CertManagerMetricsAbsent
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "No cert-manager certificate metrics — expiry alerting is blind"
              description: "certmanager_certificate_ready_status has been absent for 30m. Check the cert-manager pod and its ServiceMonitor."

  # ── Backstage database ────────────────────────────────────────────
  # 8. The 2026-11-21 case: Backstage up, Postgres up, zero connections to
  #    any plugin database (the exporter's own connection is to `backstage`
  #    and must not count). Fires after 15m.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="backstage",deployment="backstage"}'
        values: '1x40'
      - series: 'pg_up{namespace="backstage"}'
        values: '1x40'
      - series: 'pg_stat_database_numbackends{namespace="backstage",datname="backstage"}'
        values: '1x40'
      - series: 'pg_stat_database_numbackends{namespace="backstage",datname="backstage_plugin_catalog"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: BackstageNotUsingPostgres
        exp_alerts: []
      - eval_time: 16m
        alertname: BackstageNotUsingPostgres
        exp_alerts:
          - exp_labels: {severity: critical, namespace: backstage, deployment: backstage}
            exp_annotations:
              summary: "Backstage is running but has no connections to Postgres"
              description: "No backstage_plugin_* database has had a connection for 15m while Backstage and Postgres are both up. Backstage is probably on in-memory SQLite: check `backend.database` in its app-config (platform/argocd/apps/backstage.yaml). Data written now is lost on restart."
      - eval_time: 16m
        alertname: BackstagePostgresDown
        exp_alerts: []

  # 9. Same, but the plugin databases do not exist at all (day-one SQLite).
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="backstage",deployment="backstage"}'
        values: '1x40'
      - series: 'pg_up{namespace="backstage"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: BackstageNotUsingPostgres
        exp_alerts:
          - exp_labels: {severity: critical, namespace: backstage, deployment: backstage}
            exp_annotations:
              summary: "Backstage is running but has no connections to Postgres"
              description: "No backstage_plugin_* database has had a connection for 15m while Backstage and Postgres are both up. Backstage is probably on in-memory SQLite: check `backend.database` in its app-config (platform/argocd/apps/backstage.yaml). Data written now is lost on restart."

  # 10. Healthy: plugin databases have connections. Nothing fires.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="backstage",deployment="backstage"}'
        values: '1x40'
      - series: 'pg_up{namespace="backstage"}'
        values: '1x40'
      - series: 'pg_stat_database_numbackends{namespace="backstage",datname="backstage_plugin_catalog"}'
        values: '2x40'
      - series: 'pg_stat_database_numbackends{namespace="backstage",datname="backstage_plugin_auth"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BackstageNotUsingPostgres
        exp_alerts: []
      - eval_time: 30m
        alertname: BackstagePostgresDown
        exp_alerts: []

  # 11. Backstage scaled to zero (a deploy, a restart): not this alert.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="backstage",deployment="backstage"}'
        values: '0x40'
      - series: 'pg_up{namespace="backstage"}'
        values: '1x40'
      - series: 'pg_stat_database_numbackends{namespace="backstage",datname="backstage_plugin_catalog"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BackstageNotUsingPostgres
        exp_alerts: []

  # 12. Postgres down: BackstagePostgresDown fires, the other stays quiet.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="backstage",deployment="backstage"}'
        values: '1x40'
      - series: 'pg_up{namespace="backstage"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: BackstagePostgresDown
        exp_alerts: []
      - eval_time: 16m
        alertname: BackstagePostgresDown
        exp_alerts:
          - exp_labels: {severity: critical, namespace: backstage}
            exp_annotations:
              summary: "Backstage's Postgres is down or its metrics are missing"
              description: "pg_up has been 0 or absent for 15m. Check pod backstage-postgresql-0 (both containers) and the allow-ingress-postgresql-metrics NetworkPolicy."
      - eval_time: 16m
        alertname: BackstageNotUsingPostgres
        exp_alerts: []

  # 13. Exporter metrics missing entirely: BackstagePostgresDown fires.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="backstage",deployment="backstage"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: BackstagePostgresDown
        exp_alerts:
          - exp_labels: {severity: critical, namespace: backstage}
            exp_annotations:
              summary: "Backstage's Postgres is down or its metrics are missing"
              description: "pg_up has been 0 or absent for 15m. Check pod backstage-postgresql-0 (both containers) and the allow-ingress-postgresql-metrics NetworkPolicy."
