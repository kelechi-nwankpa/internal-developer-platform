---
# external-secrets — External Secrets Operator (ESO).
#
# Third GitOps-managed child under app-of-apps root. Same install pattern
# as cert-manager (ADR-0016): upstream Helm chart wrapped in an ArgoCD
# Application. This file installs the operator only; the SecretStore/
# ClusterSecretStore that gives it a backend to sync from is a separate
# Application (vault.yaml + external-secrets-stores.yaml, arriving in
# later Task 2.4 sub-tasks).
#
# See: docs/adr/0018-external-secrets-install-via-helm.md
#      docs/phases/phase-2-platform.md (Task 2.4)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Same AppProject as other platform Applications. Phase 8 tighten.
  project: default

  source:
    # Official ESO Helm repo. Note that ESO releases the chart and the
    # app image as two separate tags (chart is bare `2.8.0`, app image
    # is `v2.8.0`) that ship in lockstep. We pin the chart; the chart
    # pins the app image internally.
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.8.0
    helm:
      # Overrides:
      #   - installCRDs: true (chart default)
      #   - webhook + cert-controller enabled (chart default)
      #   - serviceMonitor.enabled: true — Task 3.5, wire Prometheus scraping
      #     of ESO's /metrics endpoint. Chart creates a ServiceMonitor pointing
      #     at the operator's Service. Requires the ServiceMonitor CRD from
      #     kube-prometheus-stack (ADR-0024). See ADR-0025 for rationale.
      valuesObject:
        serviceMonitor:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    # Conventional namespace for ESO. Created by CreateNamespace=true
    # syncOption below.
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Same rationale as cert-manager + root — SSA sidesteps the 256KB
      # annotation limit on large CRDs, ExternalSecret CRD is one such.
      - ServerSideApply=true
    # NOTE: no directory.recurse — this is a `helm` source, not a
    # `directory` source. The omitempty trap from ADR-0015 postscript
    # only applies to Application sources with `directory:` blocks.
