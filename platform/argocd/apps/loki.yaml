---
# loki — Grafana Loki (distributed) for log aggregation. Phase 3 Wave 2.
#
# Chart source: Grafana Labs' official Helm repo. Chart supports 3
# deploymentModes:
#   - SingleBinary: one pod, testing only
#   - SimpleScalable: 3 components (read/write/backend)
#   - Distributed: 6+ pods (distributor/ingester/querier/query-frontend/
#     compactor/gateway). What real prod deployments run.
#
# We chose Distributed per ADR-0030 — matches real prod pattern, teaches
# the microservices topology, same config shape as we'd run on EKS.
# Trade-off is ~2 GiB memory + ~10 pods; kind at 12 GiB VM absorbs it.
#
# Storage: MinIO via S3 API. Credentials from k8s Secret
# observability-storage-credentials (ESO-synced from Vault). Loki chart
# doesn't have a first-class existingSecret for storage — standard
# pattern is to pass credentials via env vars and enable env-var
# expansion in Loki's config via `-config.expand-env=true`.
#
# See: docs/adr/0030-observability-wave-2-stack.md
#      docs/adr/0029-object-storage-strategy.md
#      platform/observability/README.md

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    # Pinned to 6.16.0 — a known-stable release. Bump on chart review.
    targetRevision: 6.16.0
    helm:
      valuesObject:

        # ─────────────────────────────────────────────────────────────
        # Deployment mode
        # ─────────────────────────────────────────────────────────────
        deploymentMode: Distributed

        # Chart has a validation that rejects mixing modes. When we
        # request Distributed, we must explicitly zero out the
        # SimpleScalable components (backend/read/write) AND the
        # SingleBinary target — otherwise chart complains that we have
        # >0 replicas for multiple deployment topologies.
        singleBinary:
          replicas: 0
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0

        # ─────────────────────────────────────────────────────────────
        # Loki config
        # ─────────────────────────────────────────────────────────────
        loki:
          # Single-tenant mode for MVP. Wave 3 or Phase 8 could enable
          # multi-tenancy (X-Scope-OrgID header per team).
          auth_enabled: false

          # Loki 3.x requires an explicit schema config. TSDB is the
          # modern index format (replaces boltdb-shipper). Starts from
          # 2024-01-01 — any epoch before the install date works.
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          # ───────────────────────────────────────────────────────────
          # Storage — MinIO via S3 API
          # ───────────────────────────────────────────────────────────
          # No accessKeyId/secretAccessKey inline — the AWS SDK Loki
          # uses auto-detects `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY`
          # from env (populated via extraEnvFrom on each component). This
          # avoids needing `-config.expand-env=true` args + inline
          # `${...}` config expansion (chart 6.x doesn't propagate
          # loki.extraArgs to pods — that value is Loki-config args, not
          # pod args).
          storage:
            type: s3
            bucketNames:
              chunks: loki-chunks
              # We put ruler + admin in the same bucket for simplicity;
              # real prod might use separate buckets for finer IAM scoping.
              ruler: loki-chunks
              admin: loki-chunks
            s3:
              endpoint: minio.minio.svc.cluster.local:9000
              region: us-east-1  # required but arbitrary on MinIO
              s3ForcePathStyle: true
              insecure: true  # http (in-cluster only, TLS via Phase 8)

          # ───────────────────────────────────────────────────────────
          # Retention + ingestion limits
          # ───────────────────────────────────────────────────────────
          limits_config:
            retention_period: 168h  # 7 days per ADR-0030
            # Ingestion rate limits (default is 4 MB/s per tenant; fine
            # for kind since we only ingest platform logs at low volume)
            ingestion_rate_mb: 10
            ingestion_burst_size_mb: 20
            # Accept log entries up to 7d old — kubelet's log tail on
            # kind can span many hours (or days) of history. Loki's
            # default rejects anything older than ~1h, which drops
            # every pod's startup log when Alloy first starts scraping.
            # Bug 7 in Task 3.5.3 verification: hundreds of "entry too
            # far behind" errors before adding this.
            reject_old_samples: true
            reject_old_samples_max_age: 168h  # 7 days, matches retention

          # ───────────────────────────────────────────────────────────
          # Compactor — required in Distributed mode for retention
          # ───────────────────────────────────────────────────────────
          compactor:
            retention_enabled: true
            delete_request_store: s3
          commonConfig:
            replication_factor: 1  # single-tenant, single-replica ingester

        # ─────────────────────────────────────────────────────────────
        # Distributed topology — per-component config
        # ─────────────────────────────────────────────────────────────
        # Every component gets `extraEnvFrom` pointing at the ESO Secret
        # so AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are available for
        # the AWS SDK's default credential chain. Chart 6.x doesn't have
        # a shared extraEnv/extraEnvFrom that propagates to all components,
        # so we declare per-component.
        distributor:
          replicas: 1
          extraEnvFrom:
            - secretRef:
                name: observability-storage-credentials
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}

        ingester:
          replicas: 1
          # Disable zone-aware replication — chart default creates 3
          # ingester zones (a/b/c) with pod anti-affinity requiring
          # different nodes. On single-node kind, only zone-a schedules;
          # zone-b + zone-c stay Pending forever.
          zoneAwareReplication:
            enabled: false
          # Chart also sets required podAntiAffinity even in non-zone
          # mode — "don't be on same node as another ingester". For
          # single-node kind that ALSO blocks (transient during rollouts
          # when old pod is Terminating on the only node). Override to
          # empty so single-replica ingester schedules without constraint.
          affinity: {}
          extraEnvFrom:
            - secretRef:
                name: observability-storage-credentials
          persistence:
            enabled: true
            size: 5Gi
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1Gi}

        querier:
          replicas: 1
          extraEnvFrom:
            - secretRef:
                name: observability-storage-credentials
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}

        queryFrontend:
          replicas: 1
          extraEnvFrom:
            - secretRef:
                name: observability-storage-credentials
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}

        # queryScheduler MUST exist in Distributed mode — query-frontend
        # can't operate without one (would show "number of schedulers
        # connected: 0" and never accept queries). Single replica for
        # kind — real prod scales based on query volume.
        queryScheduler:
          replicas: 1
          extraEnvFrom:
            - secretRef:
                name: observability-storage-credentials
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}

        compactor:
          replicas: 1
          extraEnvFrom:
            - secretRef:
                name: observability-storage-credentials
          persistence:
            enabled: true
            size: 2Gi
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}

        indexGateway:
          replicas: 1
          extraEnvFrom:
            - secretRef:
                name: observability-storage-credentials
          persistence:
            enabled: true
            size: 2Gi
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}

        # NGINX gateway — routes API requests to the right component
        # (writes → distributor, reads → query-frontend). Alloy talks
        # to this endpoint; so does Grafana's Loki datasource. Doesn't
        # need MinIO creds (it's just an nginx reverse proxy).
        gateway:
          enabled: true
          replicas: 1
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}

        # ─────────────────────────────────────────────────────────────
        # Turn off unused components
        # ─────────────────────────────────────────────────────────────
        # These generate demo/test data or provide multi-tenant features
        # we don't need for MVP.
        chunksCache:
          enabled: false  # requires memcached; not needed at kind scale
        resultsCache:
          enabled: false
        # Bloom filters (Loki 3.1+): performance optimization for
        # queries over cold chunks. Not needed at MVP scale.
        bloomCompactor:
          replicas: 0
        bloomGateway:
          replicas: 0

        # ─────────────────────────────────────────────────────────────
        # Disable Loki's built-in Grafana Agent (we run Alloy separately)
        # ─────────────────────────────────────────────────────────────
        monitoring:
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false

        # No test pods — we validate via Alloy + query
        test:
          enabled: false

        # Chart's default is to install lokiCanary (a self-test app that
        # writes + reads canary logs). Disable for MVP.
        lokiCanary:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  # ignoreDifferences: FM6 pattern for chart-rendered StatefulSets.
  # K8s auto-injects several fields on StatefulSets that the Loki chart's
  # template doesn't declare (persistentVolumeClaimRetentionPolicy,
  # volumeClaimTemplates[*].apiVersion + kind, various template defaults).
  # Enumerating every one is fragile — so we combine two mechanisms:
  #
  # 1. ignoreDifferences on the well-known injected field
  # 2. ServerSideDiff=true sync option — ArgoCD 2.10+ computes diffs
  #    server-side via kubectl dry-run apply, correctly handling
  #    managed-fields and injected defaults for the rest.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/volumeClaimTemplates

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # ArgoCD 2.10+: compute diffs via kubectl dry-run apply on the
      # apiserver, which respects managed-fields ownership. Handles
      # K8s-injected StatefulSet defaults that jsonPointers can't easily
      # enumerate. Requires ServerSideApply=true (above) and works with
      # RespectIgnoreDifferences.
      - ServerSideDiff=true
      - RespectIgnoreDifferences=true
