---
# backstage — developer portal + service catalog + software templates.
#
# Phase 5 MVP install. Uses the official Backstage Helm chart with:
#   - Default upstream image (ghcr.io/backstage/backstage:latest) — see
#     ADR-0028 for the explicit tech-debt on :latest. Migration to a
#     custom-built image lands in Wave 2 or Phase 8.
#   - PostgreSQL sub-chart enabled (persistent state: catalog, ownership,
#     template runs) — chart bundles bitnami/postgresql.
#   - Ingress off — port-forward for kind. Phase 5 Wave 2 or Phase 8
#     wires cert-manager + Ingress at portal.idp.seniormankelz.dev.
#   - Guest auth (chart default). No SSO wiring for MVP. Phase 5 Wave 2
#     could add GitHub OAuth.
#
# See: docs/adr/0028-backstage-install-and-image-strategy.md
#      docs/phases/phase-5-backstage.md (Task 5.2)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Official Backstage-team-maintained Helm repo.
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.8.2
    helm:
      valuesObject:

        # ─────────────────────────────────────────────────────────────
        # Backstage app container
        # ─────────────────────────────────────────────────────────────
        # Pinned to 1.32.0 — a known-internally-consistent demo image
        # that predates the notifications-plugin frontend/backend
        # mismatch on newer :latest builds. Discovered this the hard
        # way when :latest broke the whole UI with
        # "NotImplementedError: No implementation available for
        # apiRef{plugin.notifications.service}".
        #
        # This is a middle ground on ADR-0028's tech debt: still the
        # upstream demo image (can't add custom plugins), but at least
        # a pinned tag (satisfies our no-:latest rule, reproducible).
        # Full Wave 2 fix (custom-built image via backstage-cli) still
        # in the deferred pile.
        backstage:
          image:
            registry: ghcr.io
            repository: backstage/backstage
            tag: "1.32.0"
          replicas: 1
          # Override chart default NODE_ENV=production. Some Backstage
          # auth flows (particularly guest and dev-only shortcuts) are
          # gated behind NODE_ENV=development. Trying this as a Path C
          # attempt before committing to Wave 2 custom image work.
          # If Backstage doesn't come up cleanly with this, we pivot to
          # Path B (defer + document).
          extraEnvVars:
            - name: NODE_ENV
              value: development

          # ───────────────────────────────────────────────────────────
          # App config overrides — required for guest auth to work
          # ───────────────────────────────────────────────────────────
          # Backstage v1.30+ dropped implicit guest auth for security.
          # Without these overrides the backend returns 401 on every
          # /api/catalog request and the UI shows "Failed to load
          # entities." Explicitly enabling guest auth here.
          #
          # Chart renders this into a ConfigMap and mounts it into the
          # container as app-config.extra.yaml, which merges with the
          # default app-config.yaml at boot.
          appConfig:
            app:
              title: IDP Portal
              baseUrl: http://localhost:7007
            backend:
              baseUrl: http://localhost:7007
              listen:
                port: 7007
              cors:
                origin: http://localhost:7007
                methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
                credentials: true
              # Backstage requires a signing key for its internal service
              # tokens. Random string here — real deployment would source
              # from ESO. MVP good enough.
              auth:
                keys:
                  - secret: development-only-signing-key-do-not-use-in-prod
            auth:
              # `development` environment allows guest auth without extra
              # opt-in. `production` requires dangerouslyAllowOutsideDevelopment.
              # For MVP kind: development is fine.
              environment: development
              providers:
                guest: {}
            catalog:
              # Rules: what entity kinds Backstage will accept from
              # configured locations. Full list for maximum flexibility.
              rules:
                - allow: [Component, System, API, Resource, Location, User, Group, Template, Domain]
              # Task 5.4 — self-catalog the platform. Each file describes
              # a slice of the entity model (see catalog/README.md):
              #   owners:     the identity model (User + Group)
              #   systems:    the grouping model (Domain + Systems)
              #   components: 14 platform Components, one per ArgoCD App
              #   apis:       the infra APIs the platform offers (XRDs)
              #
              # Why raw.githubusercontent.com and not github.com/.../blob:
              # blob URLs would require a GitHub integration token in
              # `appConfig.integrations.github` to avoid API rate limits.
              # Raw URLs go through the anonymous CDN — fine for a public
              # repo. When we add the GitHub integration in Wave 2 (for
              # scaffolder templates + pretty source links), we can switch.
              locations:
                - type: url
                  target: https://raw.githubusercontent.com/kelechi-nwankpa/internal-developer-platform/main/catalog/owners.yaml
                  rules:
                    - allow: [User, Group]
                - type: url
                  target: https://raw.githubusercontent.com/kelechi-nwankpa/internal-developer-platform/main/catalog/systems.yaml
                  rules:
                    - allow: [Domain, System]
                - type: url
                  target: https://raw.githubusercontent.com/kelechi-nwankpa/internal-developer-platform/main/catalog/components.yaml
                  rules:
                    - allow: [Component]
                - type: url
                  target: https://raw.githubusercontent.com/kelechi-nwankpa/internal-developer-platform/main/catalog/apis.yaml
                  rules:
                    - allow: [API]
            # Placeholder integrations block — real GitHub token wired
            # up in Wave 2 or Phase 8 when we add Software Templates.
            integrations: {}
            # Backstage 1.32.0's schema REQUIRES a techdocs block even
            # if we're not using TechDocs. Minimal local-only config
            # satisfies the schema without depending on S3/GCS/Azure.
            # Real TechDocs setup lands in Wave 2 or Phase 8.
            techdocs:
              builder: local
              publisher:
                type: local
              generator:
                runIn: local

        # ─────────────────────────────────────────────────────────────
        # PostgreSQL sub-chart (bitnami/postgresql)
        # ─────────────────────────────────────────────────────────────
        # Real DB matches prod shape and survives pod restart. SQLite
        # (chart default when postgresql.enabled=false) would be ephemeral.
        postgresql:
          enabled: true
          auth:
            # Auto-generate a random password on first install (chart
            # writes to a Secret). Same rotation discipline as ArgoCD
            # + Grafana admin credentials would apply if we ever rotated.
            # For MVP: accept chart-generated + never touch it.
            password: ""
            database: backstage
            username: backstage
          primary:
            persistence:
              enabled: true
              # Small — catalog + template runs won't fill this on kind.
              # EKS gets RDS via Phase 9 Crossplane XRD (nice callback
              # to Phase 4).
              size: 2Gi

        # ─────────────────────────────────────────────────────────────
        # Ingress + Service — port-forward for kind, deferred for later
        # ─────────────────────────────────────────────────────────────
        service:
          type: ClusterIP
        ingress:
          # No Ingress on kind (no LB provisioner + no real DNS). Phase 5
          # Wave 2 or Phase 8 wires cert-manager Certificate + Ingress at
          # portal.idp.seniormankelz.dev.
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: backstage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Backstage chart resources aren't especially large — SSA is still
      # good defensive default per our established pattern (ADR-0014).
      - ServerSideApply=true
