---
# external-secrets-stores — the SecretStores that give ESO backends to sync
# from.
#
# Same operator-vs-config split as cert-manager (operator) + cert-manager-
# issuers (config), and vault (operator) + vault-config (RBAC): the ESO
# operator install (external-secrets.yaml) is separate from the SecretStore
# configuration (this Application) so their lifecycles don't cross-couple.
# Chart bumps for ESO don't touch SecretStore config; adding a new backend
# doesn't reconcile the operator.
#
# On kind, this Application currently ships one ClusterSecretStore:
# vault-kv. On EKS (Phase 9), a second ClusterSecretStore
# (aws-secrets-manager) will land in the same directory, and both
# coexist under this single Application.
#
# See: docs/adr/0020-eso-backend-strategy.md

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-stores
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/kelechi-nwankpa/internal-developer-platform.git
    targetRevision: HEAD
    path: platform/external-secrets

  destination:
    server: https://kubernetes.default.svc
    # Defensive default namespace. ClusterSecretStore is cluster-scoped so
    # unaffected. If we later add namespace-scoped SecretStore or
    # ExternalSecret objects here (unlikely — those live with their
    # consuming workloads), the default lands them in external-secrets.
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
