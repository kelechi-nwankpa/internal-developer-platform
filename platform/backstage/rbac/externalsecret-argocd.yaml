---
# externalsecret-argocd.yaml
#
# Materializes a Kubernetes Secret `backstage-argocd` in the backstage
# namespace from Vault's secret/backstage/argocd path. Backstage reads
# this Secret at startup to authenticate against the in-cluster ArgoCD
# API for the @backstage-community/plugin-argocd UI (ArgoCD tab +
# sync-state tile on each Component page).
#
# WHY admin credentials for Wave 3 (and the debt we're taking on):
#   The Backstage ArgoCD plugin needs API access to list Applications
#   and read their sync/health status. Options were:
#     a) Dedicated local ArgoCD account (`backstage` with apiKey + a
#        narrower RBAC in argocd-rbac-cm). Correct answer — needs an
#        argocd-cm Helm values edit + token generation flow.
#     b) Admin credentials via the chart-generated secret
#        `argocd-initial-admin-secret`. Full-admin, API-only (no UI
#        login as backstage), but minimum plumbing.
#   Shipped: (b) for Wave 3 MVP. Flagged as Phase 8 security
#   hardening debt in docs/phases/phase-5-backstage.md Wave 3 section.
#   The Vault path + Secret shape is forward-compatible — Phase 8 just
#   swaps the Vault write + the appConfig username/password refs.
#
# WHY ESO + Vault (established pattern — ADR-0018, ADR-0020):
#   - Credentials never on disk outside Vault
#   - Rotation = `vault kv put` + ESO re-syncs within refreshInterval
#   - On EKS this ExternalSecret stays identical (per ADR-0020)
#
# BOOTSTRAP (one-time, before Backstage can use the plugin):
#   # 1. Fetch the ArgoCD admin password that the chart generated:
#   PWD=$(kubectl -n argocd get secret argocd-initial-admin-secret \
#          -o jsonpath='{.data.password}' | base64 -d)
#   # 2. Write to Vault:
#   kubectl -n vault exec -it vault-0 -- \
#     env VAULT_TOKEN="$VAULT_ROOT_TOKEN" \
#     vault kv put -mount=secret backstage/argocd \
#       username=admin \
#       password="$PWD"
#   # 3. ESO materializes the Secret within refreshInterval (1h) or
#   #    on next ExternalSecret reconcile. Force immediate:
#   kubectl -n backstage annotate externalsecret backstage-argocd \
#     force-sync=$(date +%s) --overwrite

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-argocd
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: backstage-argocd
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Keys are UPPER_SNAKE_CASE because they become env vars
        # verbatim via extraEnvVarsSecrets in platform/argocd/apps/
        # backstage.yaml → backstage.extraEnvVarsSecrets. Backstage's
        # appConfig then references them as ${ARGOCD_USERNAME} /
        # ${ARGOCD_PASSWORD}.
        ARGOCD_USERNAME: "{{ .username }}"
        ARGOCD_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: backstage/argocd
        property: username
    - secretKey: password
      remoteRef:
        key: backstage/argocd
        property: password
