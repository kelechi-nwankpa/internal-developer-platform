---
# Backstage's Postgres passwords, sourced from Vault (Phase 9).
#
# WHY: until now the bitnami Postgres sub-chart generated these passwords
# itself. A chart-generated secret has no source of truth: every fresh
# render produces a new random value, and on 2026-11-21 ArgoCD wrote such
# a value over the real one (Phase 9 log, P9-5). The stopgap was telling
# ArgoCD to ignore the Secret. This replaces the stopgap: Vault is the
# source of truth, External Secrets copies it in, and the chart is told
# to use it (postgresql.auth.existingSecret in backstage.yaml) and
# generates nothing.
#
# Key names `user-password` / `admin-password` are the ones the Backstage
# chart expects when existingSecret is set (postgresql.auth.secretKeys).
#
# Vault: secret/backstage/postgres  (user-password, admin-password)
#
# deletionPolicy: Retain — if this ExternalSecret or Vault disappears, the
# Kubernetes Secret stays, so the database and Backstage keep running.
#
# ROTATION is two steps, in this order (Postgres does not re-read the
# Secret; the password lives in the database):
#   1. ALTER USER ... PASSWORD in Postgres
#   2. vault kv put the same value; restart Backstage
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-postgresql-auth
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: backstage-postgresql-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: user-password
      remoteRef:
        key: backstage/postgres
        property: user-password
    - secretKey: admin-password
      remoteRef:
        key: backstage/postgres
        property: admin-password
