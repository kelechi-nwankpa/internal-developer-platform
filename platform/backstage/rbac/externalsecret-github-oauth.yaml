---
# externalsecret-github-oauth.yaml
#
# Materializes a Kubernetes Secret `backstage-github-oauth` in the
# backstage namespace from Vault's secret/backstage/github-oauth path.
# Backstage reads this Secret at startup to run the GitHub OAuth flow
# for user sign-in — separate primitive from the GitHub App
# (kelechi-idp-scaffolder) which handles Scaffolder's publish:github +
# catalog:register actions.
#
# WHY a separate credential from the GitHub App:
#   GitHub distinguishes two identity types that look similar but are
#   fundamentally different:
#     - GitHub App: machine identity, installation-scoped, used for
#       automation (publish:github, catalog:register).
#     - OAuth App:  user identity, authorizes on behalf of a human,
#       used for sign-in flows.
#   Backstage's integrations.github can accept EITHER an App config OR
#   OAuth credentials, but the auth provider for sign-in strictly
#   requires OAuth App credentials — no overlap.
#
# WHY Phase 8 Wave 1 ships this:
#   Wave 3 shipped with guest auth + two escape-hatch flags
#   (`auth.legacyGuestToken` + `backend.auth.dangerouslyDisableDefaultAuthPolicy`).
#   Both are explicit security debt. GitHub OAuth produces real
#   per-user service tokens that satisfy Backstage 1.44+'s strict
#   auth defaults, letting both flags come out in the same wave.
#
# BOOTSTRAP (one-time, before Backstage can sign users in):
#   1. Create a GitHub OAuth App in the kelechi-platform org:
#      https://github.com/organizations/kelechi-platform/settings/applications/new
#      - Homepage URL:        http://localhost:7007
#      - Callback URL:        http://localhost:7007/api/auth/github/handler/frame
#   2. Capture Client ID (visible) + Client Secret (regenerate button;
#      shown ONCE — save to password manager).
#   3. Write to Vault:
#      kubectl -n vault exec -i vault-0 -- \
#        env VAULT_TOKEN="$VAULT_ROOT_TOKEN" \
#        vault kv put -mount=secret backstage/github-oauth \
#          clientId=<CID> clientSecret=<CSECRET>
#   4. ESO re-syncs within refreshInterval (1h) or force:
#      kubectl -n backstage annotate externalsecret backstage-github-oauth \
#        force-sync=$(date +%s) --overwrite
#
# Phase 9 EKS promotion: the callback URL moves from localhost:7007 to
# the public Ingress hostname (portal.idp.seniormankelz.dev or similar);
# re-register the OAuth App with the new URLs or add a second redirect
# URI on the existing App.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-github-oauth
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: backstage-github-oauth
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Keys are UPPER_SNAKE_CASE so they land as env vars verbatim
        # via extraEnvVarsSecrets in platform/argocd/apps/backstage.yaml.
        # Backstage's appConfig then references them as
        # ${GITHUB_OAUTH_CLIENT_ID} / ${GITHUB_OAUTH_CLIENT_SECRET}.
        GITHUB_OAUTH_CLIENT_ID: "{{ .clientId }}"
        GITHUB_OAUTH_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: backstage/github-oauth
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: backstage/github-oauth
        property: clientSecret
