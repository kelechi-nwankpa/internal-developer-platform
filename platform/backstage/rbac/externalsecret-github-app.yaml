---
# externalsecret-github-app.yaml
#
# Materializes a Kubernetes Secret `backstage-github-app` in the
# backstage namespace from Vault's secret/backstage/github-app path.
# Backstage reads this Secret at startup to authenticate as the
# kelechi-idp-scaffolder GitHub App for Scaffolder's publish:github
# and catalog:register actions.
#
# WHY ESO + Vault (same pattern as Phase 2 ADR-0018, ADR-0020):
#   - PEM private key never on disk outside Vault (local .pem file was
#     deleted after Vault seeding)
#   - Rotation = `vault kv put` + ESO re-syncs within refreshInterval
#     → Backstage picks up on next pod restart
#   - On EKS this ExternalSecret stays identical (points at AWS Secrets
#     Manager backend via the EKS variant of vault-kv ClusterSecretStore
#     per ADR-0020)
#
# WHY 4 keys (appId, installationId, clientId, privateKey):
#   - Backstage's integrations.github requires `appId` + `installationId`
#     + `privateKey` at minimum.
#   - `clientId` is for OAuth flows (future SSO wave); included now so
#     the Secret is forward-compatible.
#   - `privateKey` is the PEM; Backstage reads it as a multi-line string
#     and passes it to the GitHub App auth library (jsonwebtoken under
#     the hood).
#
# NOTE: this file is applied via ArgoCD app `backstage-github-app`
# (added in platform/argocd/apps/backstage-github-app.yaml). Standalone
# apply works too: `kubectl apply -f` once the backstage namespace exists.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-github-app
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore   # cluster-scoped, works from any namespace
  target:
    name: backstage-github-app
    creationPolicy: Owner      # ESO owns the Secret lifecycle
    template:
      type: Opaque
      data:
        # Keys exactly as Backstage's integrations.github expects them.
        appId: "{{ .appId }}"
        installationId: "{{ .installationId }}"
        clientId: "{{ .clientId }}"
        # Multi-line PEM — preserve newlines. ESO's templating engine
        # handles the YAML escape correctly for multi-line values.
        privateKey: "{{ .privateKey }}"
  data:
    - secretKey: appId
      remoteRef:
        key: backstage/github-app
        property: appId
    - secretKey: installationId
      remoteRef:
        key: backstage/github-app
        property: installationId
    - secretKey: clientId
      remoteRef:
        key: backstage/github-app
        property: clientId
    - secretKey: privateKey
      remoteRef:
        key: backstage/github-app
        property: privateKey
