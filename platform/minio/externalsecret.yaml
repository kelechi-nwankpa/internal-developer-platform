---
# externalsecret.yaml — pulls MinIO root credentials from Vault into a
# k8s Secret that the MinIO Helm chart consumes via `existingSecret`.
#
# Vault path: kv/minio/root
# Keys expected under that path:
#   - rootUser     (typically "minioadmin")
#   - rootPassword (a strong random string; seed manually before syncing)
#
# The chart-created Secret name (below) is referenced by
# platform/argocd/apps/minio.yaml → helm.valuesObject.existingSecret.
#
# Sync order note: this file is deployed via a separate ArgoCD Application
# (minio-config) at sync-wave "-1" so ESO has a chance to create the
# k8s Secret BEFORE the chart at wave "0" tries to read it. If the wave
# ordering fails for any reason, the chart pod crash-loops until the
# Secret exists — ArgoCD's retry catches it up on the next reconcile.
#
# See: platform/minio/README.md (first-install order)

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root-credentials
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: observability-storage
spec:
  # 1h refresh: MinIO root creds don't rotate frequently. If we do rotate,
  # kick ESO with `kubectl -n external-secrets rollout restart deployment/external-secrets`
  # to force an immediate re-sync rather than waiting.
  refreshInterval: 1h

  secretStoreRef:
    # ClusterSecretStore established in Phase 2 (Task 2.4). Points ESO
    # at the in-cluster Vault via the Kubernetes auth method.
    name: vault-kv
    kind: ClusterSecretStore

  target:
    # Name of the k8s Secret ESO will create + maintain. Referenced by
    # the MinIO chart's `existingSecret` value.
    name: minio-root-credentials
    creationPolicy: Owner

  data:
    - secretKey: rootUser
      remoteRef:
        key: minio/root
        property: rootUser
    - secretKey: rootPassword
      remoteRef:
        key: minio/root
        property: rootPassword
