---
# Creates the buckets Loki and Tempo expect. Replaces the upstream
# chart's make-bucket Job (its quay.io/minio/mc image is gone too).
#
# PostSync hook: runs after every sync, once the Deployment is healthy.
# `mb --ignore-existing` makes reruns a no-op (verified locally).
#
# No shell in the image, so no `mc alias set && mc mb` script: mc reads
# its endpoint + credentials from MC_HOST_<alias>, assembled here by
# Kubernetes $(VAR) expansion. Requires URL-safe credentials (checked
# 2026-11-20: both are [A-Za-z0-9] only).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-make-buckets
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: bucket-bootstrap
    app.kubernetes.io/part-of: observability-storage
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: bucket-bootstrap
        app.kubernetes.io/part-of: observability-storage
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: cgr.dev/chainguard/minio-client@sha256:94433f625c8057d18c69675dbaa33da6e4864f084f9c44faf30d3eb8e3754e0b
          args:
            - mb
            - --ignore-existing
            - local/loki-chunks
            - local/tempo-blocks
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootPassword
            - name: MC_HOST_local
              value: http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@minio.minio.svc.cluster.local:9000
            # mc writes its config dir under HOME; keep it on the emptyDir.
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
