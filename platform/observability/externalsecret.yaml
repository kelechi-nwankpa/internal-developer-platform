---
# externalsecret.yaml — pulls MinIO root credentials from Vault into a
# k8s Secret in the observability namespace. Both Loki and Tempo
# reference this Secret via extraEnv to authenticate against MinIO for
# chunk/block storage.
#
# Vault path: secret/minio/root (SAME path as MinIO itself reads for
# its own root credential — one credential, three consumers: MinIO
# server, Loki storage client, Tempo storage client).
#
# Sync order: this file is deployed via observability-config Application
# at sync-wave "-1" so ESO creates the k8s Secret BEFORE Loki/Tempo
# chart pods start at wave "0"/"1". If ordering fails, pods crash-loop
# until Secret exists — ArgoCD's retry recovers on next reconcile.
#
# CRD-defaults-declared explicitly — per runbook FM6, ExternalSecret CRD
# auto-injects conversionStrategy/decodingStrategy/metadataPolicy/
# deletionPolicy on apply. Declaring them here prevents chronic OutOfSync.
#
# See: platform/observability/README.md
#      docs/adr/0030-observability-wave-2-stack.md
#      docs/runbooks/kind-recovery.md FM6

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-storage-credentials
  namespace: observability
  labels:
    app.kubernetes.io/name: observability-storage-credentials
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore

  target:
    name: observability-storage-credentials
    creationPolicy: Owner
    deletionPolicy: Retain

  # Secret keys named AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY so both
  # Loki and Tempo's S3 clients auto-detect them from env (via the
  # standard AWS SDK credential chain). This avoids needing Loki's
  # `-config.expand-env=true` args + inline `${...}` config expansion.
  # Vault-side keys stay `rootUser`/`rootPassword` (that's what MinIO
  # itself reads) — the `property` field remaps them for the k8s Secret.
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: minio/root
        property: rootUser
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: minio/root
        property: rootPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
