---
# objectbucket.yaml — ${{ values.name }}
#
# A request for one bucket (platform ADR-0027). The platform decides how
# to fulfil it:
#   on kind: a MinIO bucket plus a user and key limited to that bucket.
#   on EKS:  an S3 bucket (private, encrypted, versioned) plus an IAM
#            role limited to that bucket, which only this service's
#            ServiceAccount can assume (platform ADR-0034).
# Same YAML on both.
#
# `writeConnectionSecretToRef` names the Secret the platform fills in;
# deployment.yaml loads it with envFrom. Keys: BUCKET_NAME and AWS_REGION
# always; an access key and endpoint on kind; AWS_ROLE_ARN on EKS.

apiVersion: platform.idp.io/v1alpha1
kind: ObjectBucket
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
    app.kubernetes.io/name: ${{ values.name }}
spec:
  # NOTE: XRD schema (ADR-0027) wraps user-facing fields under
  # spec.parameters — not directly under spec. First template render
  # (Phase 6 Task 6.4e) missed this; ArgoCD rejected the manifest with
  # ".spec.publicRead: field not declared in schema".
  parameters:
    region: eu-west-1
    publicRead: false      # deny-by-default per CLAUDE.md §4
    versioning: true       # object versioning enabled — safe default
  # Where to write the connection details Deployment consumes via envFrom.
  writeConnectionSecretToRef:
    name: ${{ values.name }}-bucket-conn
