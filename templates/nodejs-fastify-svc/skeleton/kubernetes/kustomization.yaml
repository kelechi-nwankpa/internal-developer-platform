---
# kustomization.yaml — {{SERVICE_NAME}}
#
# Groups all k8s manifests so ArgoCD (or a human running `kubectl apply -k .`)
# applies them together with consistent labels + namespace.
#
# ArgoCD's Application (see ../argocd/application.yaml) points at this
# directory. Argo detects the kustomization.yaml + runs `kustomize build`
# → applies output.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Common labels applied to every resource. Adds portfolio-searchable
# `app.kubernetes.io/*` labels without editing every file.
commonLabels:
  app.kubernetes.io/name: {{SERVICE_NAME}}
  app.kubernetes.io/instance: {{SERVICE_NAME}}
  app.kubernetes.io/part-of: {{OWNER}}
  app.kubernetes.io/managed-by: argocd

# Resources in this directory (order = declaration order, but K8s
# is eventually-consistent — order rarely matters for a service).
resources:
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - externalsecret.yaml
  - objectbucket.yaml
  - certificate.yaml
  - ingress.yaml
