---
# template.yaml — Backstage Scaffolder Template for nodejs-fastify-svc.
#
# Registered in Backstage's catalog via a URL Location in
# platform/argocd/apps/backstage.yaml → appConfig.catalog.locations.
#
# Click-to-create flow (Phase 5 Wave 3):
#   1. Developer opens Backstage → Create → selects this template.
#   2. Fills form (name, owner, description, repoUrl, image_tag).
#   3. Scaffolder renders skeleton/ → publishes to a new GitHub repo.
#   4. Opens a PR against this platform repo adding the ArgoCD
#      Application manifest at platform/argocd/apps/<name>.yaml.
#   5. Registers the new Component in Backstage via catalog:register.
#   6. After the platform PR merges, ArgoCD root app-of-apps picks up
#      the new Application and the service deploys.
#
# See docs/adr/0031-golden-path-template-nodejs-fastify.md for the
# template design rationale.

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: nodejs-fastify-svc
  title: "Node.js + Fastify service (golden path)"
  description: |
    Scaffolds a production-shape Node.js REST service:
    Fastify 5, TypeScript strict, OpenTelemetry auto-instrumentation,
    pino JSON logs with trace_id injection, prom-client /metrics,
    Crossplane ObjectBucket XRC (S3 bucket per service), ArgoCD
    Application, Backstage Component registration. Deploys via GitOps.
    Full observability triangle lit up from day 1.
  tags:
    - nodejs
    - fastify
    - typescript
    - opentelemetry
    - golden-path
    - platform
  links:
    - title: Source template
      url: https://github.com/kelechi-nwankpa/internal-developer-platform/tree/main/templates/nodejs-fastify-svc
      icon: github
    - title: ADR-0031 (why this template)
      url: https://github.com/kelechi-nwankpa/internal-developer-platform/blob/main/docs/adr/0031-golden-path-template-nodejs-fastify.md
      icon: docs
spec:
  owner: user:default/kaycee
  type: service

  # ─────────────────────────────────────────────────────────────
  # parameters — user input, rendered as a form by Backstage
  # ─────────────────────────────────────────────────────────────
  # Design decision (5W3.1 "A"): minimum form fields only. Advanced
  # knobs (replicas, resources, repoVisibility) are edited in the
  # service repo after scaffolding via PR, not here.
  parameters:
    - title: Service identity
      required:
        - name
        - owner
        - description
      properties:
        name:
          title: Service name
          type: string
          description: |
            Kebab-case, DNS-1035 compliant. Used as the k8s namespace,
            Deployment name, and GitHub repo name.
          pattern: '^[a-z][a-z0-9-]{1,38}[a-z0-9]$'
          ui:autofocus: true
        owner:
          title: Owner team
          type: string
          description: |
            Backstage Group entity that owns this service. Kebab-case.
          pattern: '^[a-z][a-z0-9-]*$'
          default: platform-team
        description:
          title: Short description
          type: string
          description: One-line summary shown in the Backstage catalog card.
          maxLength: 120

    - title: Deployment
      required:
        - repoUrl
      properties:
        image_tag:
          title: Initial container image tag
          type: string
          description: |
            Version tag for the first push to GHCR. Pinned per release;
            no `latest` (CLAUDE.md §9). Phase 7 CI overrides on bump.
          default: v0.1.0
          pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$'
        repoUrl:
          title: Destination repository
          type: string
          description: |
            GitHub owner + repo for the new service. Must not already exist
            (publish:github refuses to overwrite).
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  # ─────────────────────────────────────────────────────────────
  # steps — Scaffolder actions (executed server-side on submit)
  # ─────────────────────────────────────────────────────────────
  steps:
    # 1. Render the service skeleton (Nunjucks) into ./service/.
    #    Values exposed to the skeleton:
    #      - name, owner, description, image_tag (direct from form)
    #      - github_org, repo_url (derived from parsed repoUrl)
    - id: fetch-service
      name: Render service skeleton
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./service
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description }}
          image_tag: ${{ parameters.image_tag }}
          github_org: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repo_url: https://github.com/${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }}.git

    # 2. Render the platform-skeleton (ArgoCD Application manifest)
    #    into ./platform-additions/. The templated filename
    #    `${{ values.name }}.yaml` is renamed during fetch:template.
    - id: fetch-platform
      name: Render platform-repo additions
      action: fetch:template
      input:
        url: ./platform-skeleton
        targetPath: ./platform-additions
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          github_org: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repo_url: https://github.com/${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }}.git

    # 3. Create the new service GitHub repo + first commit.
    #    GitHub App creds (installed on this account) authorize this;
    #    see docs/phases/phase-5-backstage.md Wave 2 for the auth path.
    - id: publish-service
      name: Create GitHub repo + push service
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        sourcePath: ./service
        description: ${{ parameters.description }}
        defaultBranch: main
        # Public — portfolio project. Toggle to `private` for real orgs.
        repoVisibility: public
        # First commit author + message. Co-authors omitted (user policy).
        gitCommitMessage: |
          feat: scaffold ${{ parameters.name }} from nodejs-fastify-svc template
        gitAuthorName: Backstage Scaffolder
        gitAuthorEmail: scaffolder@idp.local

    # 4. Open a PR against the platform repo adding the ArgoCD
    #    Application manifest. Design decision 5W3.1 "B": PR not direct
    #    commit, so the service's existence is reviewed by a human
    #    before ArgoCD begins syncing. Auto-merge is a Phase 8 unlock.
    - id: open-platform-pr
      name: PR ArgoCD Application into platform repo
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=kelechi-nwankpa&repo=internal-developer-platform
        branchName: scaffolder/${{ parameters.name }}
        title: "feat(platform): deploy ${{ parameters.name }} via ArgoCD"
        description: |
          Scaffolded by Backstage from the `nodejs-fastify-svc` template.

          Adds `platform/argocd/apps/${{ parameters.name }}.yaml` so the
          root app-of-apps picks up the new Application on next reconcile.

          Service repo: ${{ steps['publish-service'].output.remoteUrl }}
          Service namespace: `${{ parameters.name }}`
          Owner: `${{ parameters.owner }}`

          Review checklist:
          - [ ] Service name follows DNS-1035 (regex-enforced in template)
          - [ ] Image tag is pinned semver, not `latest` (CLAUDE.md §9)
          - [ ] `${{ parameters.name }}` namespace has Vault secrets seeded
                (else pod crashloops until app-config exists)
          - [ ] Owner group `${{ parameters.owner }}` exists in catalog
        targetBranchName: main
        sourcePath: ./platform-additions
        commitMessage: |
          feat(platform): add ArgoCD Application for ${{ parameters.name }}

    # 5. Register the new Component in Backstage's catalog by adding
    #    a URL Location pointing at the service repo's catalog-info.yaml.
    - id: register-service
      name: Register in Backstage catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-service'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # ─────────────────────────────────────────────────────────────
  # output — links shown after Create completes
  # ─────────────────────────────────────────────────────────────
  output:
    links:
      - title: Service repository
        url: ${{ steps['publish-service'].output.remoteUrl }}
        icon: github
      - title: Platform repo PR (merge to deploy)
        url: ${{ steps['open-platform-pr'].output.remoteUrl }}
        icon: dashboard
      - title: Open in Backstage catalog
        icon: catalog
        entityRef: ${{ steps['register-service'].output.entityRef }}
