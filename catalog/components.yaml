---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: crossplane
  description: "Crossplane core — the Kubernetes-native infrastructure API layer. XRDs + Compositions turn 'apply this YAML' into 'provision that cloud resource'."
  annotations:
    backstage.io/kubernetes-id: crossplane
    backstage.io/kubernetes-namespace: crossplane-system
    backstage.io/kubernetes-label-selector: app.kubernetes.io/instance=crossplane
    argocd/app-name: crossplane
    backstage.io/source-location: url:https://github.com/kelechi-nwankpa/internal-developer-platform/blob/main/platform/argocd/apps/crossplane.yaml
  tags: [platform, infrastructure, iac]
  links:
