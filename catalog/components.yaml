---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: crossplane-providers
  description: "AWS providers (family + s3 + iam) plus Functions (fn-go-templating + fn-auto-ready). The layer that turns Crossplane XRs into AWS API calls."
  annotations:
    backstage.io/kubernetes-id: crossplane-providers
    backstage.io/kubernetes-namespace: crossplane-system
    # Every provider/function pod has `pkg.crossplane.io/provider=<name>`
    # (different value per provider, but the KEY exists on all of them).
    # Label-existence selector matches any pod carrying the key.
    backstage.io/kubernetes-label-selector: pkg.crossplane.io/provider
    argocd/app-name: crossplane-providers
    backstage.io/source-location: url:https://github.com/kelechi-nwankpa/internal-developer-platform/blob/main/platform/argocd/apps/crossplane-providers.yaml
  tags: [platform, infrastructure, iac, aws]
spec:
  type: service
  lifecycle: experimental
  owner: platform-team
  system: platform-infra
  dependsOn:
    - component:crossplane

