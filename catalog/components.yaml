# ─────────────────────────────────────────────────────────────────────
# platform-infra
# ─────────────────────────────────────────────────────────────────────

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: argocd
  # No argocd/app-name annotation — ArgoCD manages itself via a pinned
  # raw manifest install (ADR-0014), not an ArgoCD Application. The
  # `root` app-of-apps is the closest analogue but conceptually meta.
  description: "GitOps control plane — reconciles cluster state to git. Installed via raw pinned manifest (ADR-0014), then app-of-apps takes over (ADR-0015)."
  annotations:
    backstage.io/kubernetes-id: argocd
    backstage.io/kubernetes-namespace: argocd
    # No shared label across the 7 ArgoCD pods (raw manifest doesn't
    # set `app.kubernetes.io/instance` — each pod's `name` label is its
    # sub-component's own name). Set-based match enumerates them all.
    # Wave 2 could add a Kustomize overlay injecting a shared label.
    backstage.io/kubernetes-label-selector: "app.kubernetes.io/name in (argocd-server,argocd-application-controller,argocd-repo-server,argocd-redis,argocd-notifications-controller,argocd-applicationset-controller,argocd-dex-server)"
    backstage.io/source-location: url:https://github.com/kelechi-nwankpa/internal-developer-platform/tree/main/platform/argocd
  tags: [platform, infrastructure, gitops]
  links:
    - url: https://github.com/kelechi-nwankpa/internal-developer-platform/blob/main/docs/adr/0014-argocd-raw-install-vs-helm.md
      title: ADR-0014
      icon: docs
    - url: https://github.com/kelechi-nwankpa/internal-developer-platform/blob/main/docs/adr/0015-argocd-app-of-apps-pattern.md
      title: ADR-0015
      icon: docs
spec:
  type: service
  lifecycle: experimental
  owner: platform-team
  system: platform-infra

