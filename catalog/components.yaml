---
# components.yaml — 14 platform Components, one per ArgoCD Application
# (plus ArgoCD itself, which self-manages via a raw manifest and is not
# an Application on the cluster but IS still a platform component).
#
# Every Component follows the same shape:
#   - spec.type: service       (all are running services, closest fit)
#   - spec.lifecycle: experimental  (we're on kind; nothing is prod yet)
#   - spec.owner: platform-team
#   - spec.system: one of platform-security / platform-observability /
#     platform-infra
#
# Annotations that matter for Task 5.5 plugin wiring:
#   - backstage.io/kubernetes-id: the label the Kubernetes plugin looks
#     for on pods/deployments. We keep it equal to the component name.
#   - argocd/app-name: the ArgoCD Application name. Same rule: equal to
#     the component name. `argocd` component omits this — it has no
#     Application because it manages itself.
#   - backstage.io/source-location: link to the file that defines the
#     component in git. Renders as "View source" in the UI.

# ─────────────────────────────────────────────────────────────────────
# platform-security
# ─────────────────────────────────────────────────────────────────────

