---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kube-prometheus-stack
  description: "Prometheus + Grafana + Alertmanager + prometheus-operator bundled as one chart. The whole metrics stack in one Application."
  annotations:
    backstage.io/kubernetes-id: kube-prometheus-stack
    backstage.io/kubernetes-namespace: monitoring
    # The chart bundles multiple StatefulSets/Deployments each with a
    # sub-instance label (kube-prometheus-stack, ...-alertmanager,
    # ...-prometheus). Set-based match catches all 6+ pods.
    backstage.io/kubernetes-label-selector: "app.kubernetes.io/instance in (kube-prometheus-stack,kube-prometheus-stack-alertmanager,kube-prometheus-stack-prometheus)"
    argocd/app-name: kube-prometheus-stack
    backstage.io/source-location: url:https://github.com/kelechi-nwankpa/internal-developer-platform/blob/main/platform/argocd/apps/kube-prometheus-stack.yaml
  tags: [platform, observability, metrics]
  links:
    - url: https://github.com/kelechi-nwankpa/internal-developer-platform/blob/main/docs/adr/0024-kube-prometheus-stack.md
      title: ADR-0024
      icon: docs
spec:
  type: service
  lifecycle: experimental
  owner: platform-team
  system: platform-observability

